```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071d3b">

<title>Mis XV Años - Marian</title>

<style>
/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #071d3b;
    color: #f4d77a;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}

/* =========================
   NIEVE
========================= */

#copos {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
}

.copo {
    position: absolute;
    top: -30px;
    color: #ffffff;
    user-select: none;
    opacity: 0.85;
    animation-name: caer;
    animation-timing-function: linear;
    animation-iteration-count: 1;
}

@keyframes caer {
    0% {
        transform:
            translateY(-30px)
            translateX(0)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.9;
    }

    50% {
        transform:
            translateY(50vh)
            translateX(35px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(-35px)
            rotate(360deg);
        opacity: 0;
    }
}

/* =========================
   PORTADA
========================= */

#portada {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    background-color: #071d3b;
    background-image: url("portada.jpeg");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;

    cursor: pointer;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

#portada.saliendo {
    opacity: 0;
    transform: scale(1.06);
    pointer-events: none;
}

.mensaje-portada {
    margin-bottom: 8vh;

    color: #f4d77a;
    font-size: clamp(14px, 3vw, 20px);
    letter-spacing: 3px;
    text-align: center;

    text-shadow:
        0 2px 10px rgba(0,0,0,.8);

    animation: brillo 2s infinite alternate;
}

@keyframes brillo {
    from {
        opacity: .55;
        transform: translateY(3px);
    }

    to {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* =========================
   CONTENIDO
========================= */

#contenido {
    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#contenido.activo {
    opacity: 1;
    visibility: visible;
}

/* =========================
   SECCIONES
========================= */

.seccion {
    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background-color: #071d3b;

    opacity: 0;
    transform: translateY(40px);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

.seccion.visible {
    opacity: 1;
    transform: translateY(0);
}

/* =========================
   IMÁGENES
========================= */

.imagen-fondo {
    width: 100%;
    min-height: 100vh;

    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

/* =========================
   BOTÓN CONFIRMAR
========================= */

.boton-area {
    position: absolute;

    bottom: 9%;

    left: 50%;
    transform: translateX(-50%);

    z-index: 10;

    text-align: center;
}

.boton-confirmar {
    border: 1px solid #f4d77a;

    background:
        linear-gradient(
            135deg,
            #b8860b,
            #f4d77a,
            #d4af37
        );

    color: #071d3b;

    padding: 15px 28px;

    border-radius: 50px;

    font-family: Georgia, serif;
    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 20px rgba(244,215,122,.35),
        0 6px 20px rgba(0,0,0,.35);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.boton-confirmar:hover {
    transform: scale(1.06);

    box-shadow:
        0 0 30px rgba(244,215,122,.6),
        0 8px 25px rgba(0,0,0,.4);
}

.boton-confirmar:active {
    transform: scale(.96);
}

/* =========================
   BOTÓN MÚSICA
========================= */

#botonMusica {
    position: fixed;

    top: 20px;
    right: 20px;

    width: 48px;
    height: 48px;

    z-index: 10000;

    border-radius: 50%;

    border: 1px solid #f4d77a;

    background: rgba(7,29,59,.85);

    color: #f4d77a;

    font-size: 21px;

    cursor: pointer;

    display: none;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 0 15px rgba(244,215,122,.25);

    backdrop-filter: blur(5px);
}

#botonMusica.visible {
    display: flex;
}

/* =========================
   DESTELLOS DORADOS
========================= */

.destello {
    position: fixed;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #f4d77a;

    pointer-events: none;

    z-index: 9998;

    animation: destello 2s ease-out forwards;
}

@keyframes destello {
    0% {
        opacity: 0;
        transform: scale(0);
    }

    40% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(0);
    }
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .seccion {
        padding: 0;
        min-height: 100svh;
    }

    .imagen-fondo {
        min-height: 100svh;
    }

    .mensaje-portada {
        margin-bottom: 7vh;
        font-size: 13px;
        letter-spacing: 2px;
    }

    .boton-confirmar {
        font-size: 15px;
        padding: 13px 22px;
    }

    #botonMusica {
        top: 14px;
        right: 14px;
        width: 44px;
        height: 44px;
    }
}
</style>
</head>


<body>

<!-- =========================
     MÚSICA
========================= -->

<audio id="musica" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
</audio>


<!-- =========================
     COPOS
========================= -->

<div id="copos"></div>


<!-- =========================
     BOTÓN MÚSICA
========================= -->

<button id="botonMusica"
        aria-label="Controlar música"
        onclick="alternarMusica()">
    🔊
</button>


<!-- =========================
     PORTADA
========================= -->

<section id="portada"
         onclick="abrirInvitacion()">

    <div class="mensaje-portada">
        Toca para abrir la invitación ✨
    </div>

</section>


<!-- =========================
     CONTENIDO
========================= -->

<main id="contenido">


    <!-- INVITACIÓN -->

    <section class="seccion">

        <div
            class="imagen-fondo"
            style="background-image:url('invitacion.jpeg');">
        </div>

    </section>


    <!-- DETALLES -->

    <section class="seccion">

        <div
            class="imagen-fondo"
            style="background-image:url('detalles.jpeg');">
        </div>

    </section>


    <!-- CONFIRMACIÓN -->

    <section class="seccion">

        <div
            class="imagen-fondo"
            style="background-image:url('confirmar.jpeg');">
        </div>


        <div class="boton-area">

            <button
                class="boton-confirmar"
                onclick="confirmarAsistencia(event)">

                💌 Confirmar asistencia

            </button>

        </div>

    </section>


    <!-- FINAL -->

    <section class="seccion">

        <div
            class="imagen-fondo"
            style="background-image:url('final.jpeg');">
        </div>

    </section>


</main>


<script>

/* =========================
   VARIABLES
========================= */

const musica =
    document.getElementById("musica");

const portada =
    document.getElementById("portada");

const contenido =
    document.getElementById("contenido");

const botonMusica =
    document.getElementById("botonMusica");

let musicaEncendida = false;
let invitacionAbierta = false;


/* =========================
   CREAR COPOS
========================= */

function crearCopo() {

    const copo =
        document.createElement("span");

    copo.className = "copo";

    const simbolos = [
        "❄",
        "❅",
        "❆",
        "✦",
        "•"
    ];

    copo.textContent =
        simbolos[
            Math.floor(
                Math.random() *
                simbolos.length
            )
        ];

    copo.style.left =
        Math.random() * 100 + "vw";

    const tamanio =
        Math.random() * 14 + 8;

    copo.style.fontSize =
        tamanio + "px";

    const duracion =
        Math.random() * 6 + 6;

    copo.style.animationDuration =
        duracion + "s";

    copo.style.opacity =
        Math.random() * .6 + .3;

    document
        .getElementById("copos")
        .appendChild(copo);

    setTimeout(() => {

        copo.remove();

    }, (duracion + 1) * 1000);
}


/* =========================
   NIEVE CONTINUA
========================= */

setInterval(crearCopo, 180);


/* =========================
   ABRIR INVITACIÓN
========================= */

function abrirInvitacion() {

    if (invitacionAbierta) return;

    invitacionAbierta = true;


    /* Música */

    musica.volume = 0.7;

    musica.play()
        .then(() => {

            musicaEncendida = true;

            botonMusica.textContent = "🔊";

        })
        .catch(() => {

            botonMusica.textContent = "🔇";

        });


    /* Portada */

    portada.classList.add("saliendo");


    setTimeout(() => {

        portada.style.display = "none";

        contenido.classList.add("activo");

        botonMusica.classList.add("visible");

        mostrarSecciones();

        crearDestellos();

    }, 900);
}


/* =========================
   MOSTRAR SECCIONES
========================= */

function mostrarSecciones() {

    const secciones =
        document.querySelectorAll(".seccion");

    secciones.forEach(
        (seccion, indice) => {

            setTimeout(() => {

                seccion.classList.add(
                    "visible"
                );

            }, indice * 350);

        }
    );
}


/* =========================
   CONTROL DE MÚSICA
========================= */

function alternarMusica() {

    if (musica.paused) {

        musica.play();

        botonMusica.textContent = "🔊";

        musicaEncendida = true;

    } else {

        musica.pause();

        botonMusica.textContent = "🔇";

        musicaEncendida = false;

    }
}


/* =========================
   CONFIRMAR WHATSAPP
========================= */

function confirmarAsistencia(event) {

    event.stopPropagation();


    /*
       CAMBIA ESTE NÚMERO POR EL WHATSAPP
       DONDE QUIERES RECIBIR LAS CONFIRMACIONES.

       Ejemplo México:
       529511234567
    */

    const telefono =
        "2871424816";


    const mensaje =
        "Hola, confirmo mi asistencia a los XV años de Marian. 💙💛";


    const url =
        "https://wa.me/" +
        telefono +
        "?text=" +
        encodeURIComponent(mensaje);


    window.open(
        url,
        "_blank"
    );
}


/* =========================
   DESTELLOS
========================= */

function crearDestellos() {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        setTimeout(() => {

            const destello =
                document.createElement(
                    "div"
                );

            destello.className =
                "destello";

            destello.style.left =
                Math.random() * 100 + "vw";

            destello.style.top =
                Math.random() * 100 + "vh";

            document.body.appendChild(
                destello
            );

            setTimeout(() => {

                destello.remove();

            }, 2000);

        }, i * 120);

    }
}

</script>

</body>
</html>

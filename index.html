<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:#fff;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
}


/* =========================================================
   SECCIONES
========================================================= */

.seccion{
    position:relative;
    width:100%;
    margin:0;
    padding:0;
}

.seccion img{
    display:block;
    width:100%;
    height:auto;
    margin:0;
    padding:0;
}


/* =========================================================
   PORTADA
========================================================= */

#portada{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    z-index:5000;
    background:#000;
    cursor:pointer;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#portada.oculta{
    opacity:0;
    transform:scale(1.05);
    pointer-events:none;
}

#portada img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =========================================================
   BOTÓN TOCAR
========================================================= */

.boton-abrir{
    position:absolute;

    left:50%;
    bottom:45px;

    transform:translateX(-50%);

    padding:14px 30px;

    background:rgba(255,255,255,.93);

    border:2px solid #c9a227;

    border-radius:40px;

    color:#17467f;

    font-size:15px;
    font-weight:bold;

    letter-spacing:1px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.3);

    animation:pulso 2s infinite;
}

@keyframes pulso{

    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.06);
    }
}


/* =========================================================
   CONTENIDO PRINCIPAL
========================================================= */

#contenido{
    position:relative;
    width:100%;

    opacity:0;

    transform:translateY(25px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#contenido.visible{
    opacity:1;
    transform:translateY(0);
}


/* =========================================================
   BOTÓN MÚSICA
========================================================= */

.boton-musica{
    position:fixed;

    right:18px;
    bottom:18px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:2px solid #c9a227;

    background:rgba(255,255,255,.94);

    color:#17467f;

    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:9000;

    box-shadow:
        0 4px 15px rgba(0,0,0,.25);
}


/* =========================================================
   CRONÓMETRO
========================================================= */

.cronometro{
    position:relative;
    width:100%;
    overflow:hidden;
}

.cronometro > img{
    width:100%;
    height:auto;
    display:block;
}


/* =========================================================
   CONTADOR
========================================================= */

.contador{

    position:absolute;

    left:50%;
    top:59%;

    transform:translate(-50%,-50%);

    width:92%;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:8px;

    z-index:50;
}

.contador-item{
    min-width:62px;
    text-align:center;
}

.contador-numero{

    font-size:clamp(22px,5vw,42px);

    font-weight:bold;

    color:white;

    text-shadow:
        0 2px 5px rgba(0,0,0,.7),
        0 0 10px rgba(255,255,255,.35);
}

.contador-texto{

    font-size:clamp(8px,2vw,12px);

    color:white;

    font-weight:bold;

    letter-spacing:1px;

    text-shadow:
        0 2px 4px rgba(0,0,0,.7);
}


/* =========================================================
   🌹 ROSA
========================================================= */

.rosa-wrapper{

    position:absolute;

    left:50%;

    /*
       IMPORTANTE:
       La rosa queda abajo del cronómetro
       y no invade los números.
    */

    bottom:-15px;

    width:180px;
    height:230px;

    transform:translateX(-50%) scale(.50);

    transform-origin:bottom center;

    z-index:40;

    pointer-events:none;
}


/* CONTENEDOR ORIGINAL */

.rosa-wrapper .container{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
}


/* =========================================================
   GLASS
========================================================= */

.rosa-wrapper .glass{

    height:350px;
    width:200px;

    background:#122139;

    border-radius:300px 300px 0 0;

    position:absolute;

    left:-100px;
    top:-175px;
}

.rosa-wrapper .glass:before{

    content:"";

    height:10px;
    width:10px;

    transform-origin:center;

    border:10px solid #122139;

    border-radius:100%;

    position:absolute;

    left:87px;
    top:-25px;
}

.rosa-wrapper .glass:after{

    content:"";

    position:absolute;

    height:15px;
    width:250px;

    background:#a52a2a;

    top:100%;

    left:-13%;
}


/* =========================================================
   SHINE
========================================================= */

.rosa-wrapper .shine{

    width:12px;
    height:140px;

    background:white;

    opacity:.2;

    position:absolute;

    left:85%;
    top:80px;

    border-radius:100px;

    z-index:10;
}

.rosa-wrapper .shine:before{

    content:"";

    width:12px;
    height:20px;

    position:absolute;

    background:white;

    top:160px;

    border-radius:100px;
}


/* =========================================================
   PÉTALOS
========================================================= */

.rosa-wrapper .petals > div{

    position:absolute;

    background:#d52d58;

    width:45px;
    height:80px;

    top:55px;

    transition:all .5s ease-out;
}

.rosa-wrapper .petals > div:nth-child(1){

    border-radius:15px;

    box-shadow:0 0 30px #f594b8;

    left:80px;
    top:60px;

    background:#d52d58;
}

.rosa-wrapper .petals > div:nth-child(2),
.rosa-wrapper .petals > div:nth-child(4),
.rosa-wrapper .petals > div:nth-child(6){

    background:#b81b43;

    left:60px;

    border-radius:0 30px 0 30px;

    transform-origin:bottom right;
}

.rosa-wrapper .petals > div:nth-child(3),
.rosa-wrapper .petals > div:nth-child(5),
.rosa-wrapper .petals > div:nth-child(7){

    background:#b81b43;

    left:100px;

    border-radius:30px 0 30px 0;

    transform-origin:bottom left;
}

.rosa-wrapper .petals > div:nth-child(2){

    z-index:5;

    background:#ab1a3f;

    top:75px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:bloom2 3s ease-in-out;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(3){

    z-index:4;

    background:#ab1a3f;

    top:75px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:
        bloom3 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(4){

    z-index:3;

    background:#b81b43;

    top:70px;
    height:75px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:
        bloom4 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(5){

    z-index:2;

    background:#b81b43;

    top:70px;
    height:75px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:
        bloom5 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(6){

    z-index:1;

    background:#c9204b;

    top:65px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.3);

    animation:
        bloom6 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(7){

    z-index:0;

    background:#c9204b;

    top:65px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.3);

    animation:
        bloom7 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}


/* =========================================================
   PÉTALOS QUE CAEN
========================================================= */

.rosa-wrapper .deadPetals > div{

    position:absolute;

    background:#d52d58;

    width:20px;
    height:15px;

    top:120px;

    border-radius:0 30px 0 30px;

    box-shadow:
        0 0 30px rgba(245,148,184,.5);

    transition:all .5s ease-out;
}

.rosa-wrapper .deadPetals > div:nth-child(1){

    left:67px;

    transform:rotate(-30deg);

    animation:
        falling 20s 4s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(2){

    left:104px;

    transform:rotate(-30deg);

    animation:
        falling 20s 8s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(3){

    left:91px;

    transform:rotate(-30deg);

    animation:
        falling 20s 12s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(4){

    left:69px;

    transform:rotate(-30deg);

    animation:
        falling 20s 16s ease-in-out infinite;
}


/* =========================================================
   HOJAS
========================================================= */

.rosa-wrapper .leaves > div:nth-last-child(1){

    position:absolute;

    width:55px;
    height:30px;

    background:#338f37;

    top:120px;
    left:75px;

    border-radius:100px;
}

.rosa-wrapper .leaves > div:nth-child(1){

    position:absolute;

    width:6px;
    height:210px;

    background:#054c05;

    top:95px;
    left:100px;

    border-radius:0 0 100px 100px;
}

.rosa-wrapper .leaves > div:nth-child(2){

    position:absolute;

    width:30px;
    height:50px;

    border-radius:5px 40px 20px 40px;

    background:#054c05;

    transform-origin:bottom;

    transform:rotate(-30deg);

    top:180px;
    left:80px;

    box-shadow:inset 5px 5px #066406;
}

.rosa-wrapper .leaves > div:nth-child(3){

    position:absolute;

    width:30px;
    height:50px;

    border-radius:40px 5px 40px 20px;

    background:#054c05;

    transform-origin:bottom;

    transform:rotate(30deg);

    top:150px;
    left:95px;

    box-shadow:inset -5px 5px #066406;
}


/* =========================================================
   ESPINAS
========================================================= */

.rosa-wrapper .thorns > div{

    position:absolute;

    width:0;
    height:0;

    top:140px;
}

.rosa-wrapper .thorns > div:nth-child(odd){

    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    border-left:5px solid #054c05;

    left:105px;
}

.rosa-wrapper .thorns > div:nth-child(even){

    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    border-right:5px solid #054c05;

    left:95px;
}

.rosa-wrapper .thorns > div:nth-child(1){
    top:200px;
}

.rosa-wrapper .thorns > div:nth-child(2){
    top:170px;
}

.rosa-wrapper .thorns > div:nth-child(4){
    top:230px;
}


/* =========================================================
   ANIMACIONES ORIGINALES
========================================================= */

@keyframes bloom2{

    50%{
        transform:rotate(-90deg);
        top:200px;
        left:100px;
    }

    100%{
        transform:rotate(-60deg);
        top:252px;
        left:50px;

        background:#71122a;

        box-shadow:
            0 0 0 rgba(245,148,184,0);
    }
}

@keyframes bloom3{

    100%{
        transform:rotate(45deg);
    }
}

@keyframes bloom4{

    100%{
        transform:rotate(-20deg);
    }
}

@keyframes bloom5{

    100%{
        transform:rotate(20deg);
    }
}

@keyframes bloom6{

    100%{
        transform:rotate(-5deg);
    }
}

@keyframes bloom7{

    100%{
        transform:rotate(5deg);
    }
}

@keyframes glowing{

    50%{

        background:#d7365f;

        box-shadow:
            0 0 60px #f594b8;
    }
}

@keyframes falling{

    20%{

        top:335px;

        background:#9d193b;

        box-shadow:
            0 0 0 rgba(245,148,184,0);
    }

    100%{

        top:335px;

        opacity:0;
    }
}


/* =========================================================
   ❄️ COPOS
========================================================= */

.copos-nieve{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    overflow:hidden;

    z-index:8000;
}

.copos-nieve span{

    position:absolute;

    top:-30px;

    color:#fff;

    font-family:Arial,sans-serif;

    font-size:18px;

    line-height:1;

    opacity:0;

    text-shadow:
        0 0 4px #fff,
        0 0 8px #fff,
        0 0 14px rgba(150,210,255,.8);

    animation:
        nieveCaer linear infinite;
}

.copos-nieve span:nth-child(1){
    left:3%;
    animation-duration:9s;
    animation-delay:0s;
}

.copos-nieve span:nth-child(2){
    left:9%;
    animation-duration:12s;
    animation-delay:2s;
}

.copos-nieve span:nth-child(3){
    left:15%;
    animation-duration:10s;
    animation-delay:4s;
}

.copos-nieve span:nth-child(4){
    left:22%;
    animation-duration:13s;
    animation-delay:1s;
}

.copos-nieve span:nth-child(5){
    left:29%;
    animation-duration:11s;
    animation-delay:5s;
}

.copos-nieve span:nth-child(6){
    left:36%;
    animation-duration:14s;
    animation-delay:3s;
}

.copos-nieve span:nth-child(7){
    left:43%;
    animation-duration:10s;
    animation-delay:6s;
}

.copos-nieve span:nth-child(8){
    left:50%;
    animation-duration:13s;
    animation-delay:2s;
}

.copos-nieve span:nth-child(9){
    left:57%;
    animation-duration:11s;
    animation-delay:7s;
}

.copos-nieve span:nth-child(10){
    left:64%;
    animation-duration:14s;
    animation-delay:4s;
}

.copos-nieve span:nth-child(11){
    left:71%;
    animation-duration:10s;
    animation-delay:1s;
}

.copos-nieve span:nth-child(12){
    left:78%;
    animation-duration:13s;
    animation-delay:5s;
}

.copos-nieve span:nth-child(13){
    left:84%;
    animation-duration:11s;
    animation-delay:3s;
}

.copos-nieve span:nth-child(14){
    left:90%;
    animation-duration:14s;
    animation-delay:8s;
}

.copos-nieve span:nth-child(15){
    left:96%;
    animation-duration:10s;
    animation-delay:2s;
}

.copos-nieve span:nth-child(16){
    left:18%;
    animation-duration:15s;
    animation-delay:7s;
}

.copos-nieve span:nth-child(17){
    left:47%;
    animation-duration:12s;
    animation-delay:9s;
}

.copos-nieve span:nth-child(18){
    left:68%;
    animation-duration:15s;
    animation-delay:6s;
}

.copos-nieve span:nth-child(19){
    left:81%;
    animation-duration:11s;
    animation-delay:10s;
}

.copos-nieve span:nth-child(20){
    left:93%;
    animation-duration:13s;
    animation-delay:11s;
}

@keyframes nieveCaer{

    0%{
        transform:
            translate3d(0,-50px,0)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:.9;
    }

    50%{
        transform:
            translate3d(35px,50vh,0)
            rotate(180deg);

        opacity:.8;
    }

    100%{
        transform:
            translate3d(-30px,110vh,0)
            rotate(360deg);

        opacity:0;
    }
}


/* =========================================================
   CONFIRMACIÓN
========================================================= */

.confirmar{
    position:relative;
}

.boton-confirmar{

    position:absolute;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    display:inline-block;

    padding:14px 28px;

    background:#17467f;

    color:white;

    text-decoration:none;

    border:2px solid #c9a227;

    border-radius:40px;

    font-weight:bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);

    white-space:nowrap;
}


/* =========================================================
   CRÉDITOS
========================================================= */

.creditos{

    text-align:center;

    padding:30px 20px 40px;

    background:#fff;

    color:#17467f;
}

.credito-titulo{

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:6px;
}

.credito-marca{

    font-size:25px;

    font-weight:bold;

    color:#c9a227;

    margin-bottom:10px;
}

.credito-whatsapp{

    color:#17467f;

    text-decoration:none;

    font-size:13px;

    border-bottom:1px solid #c9a227;

    padding-bottom:3px;
}


/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:600px){

    .contador{
        width:98%;
        gap:2px;
    }

    .contador-item{
        min-width:52px;
    }

    .rosa-wrapper{

        bottom:-18px;

        transform:
            translateX(-50%)
            scale(.42);
    }

    .boton-confirmar{
        bottom:18px;
        font-size:14px;
        padding:12px 22px;
    }

}

</style>
</head>

<script>

/* =========================================================
   🎵 MÚSICA
========================================================= */

const musica =
    document.getElementById("musica");

const botonMusica =
    document.getElementById("botonMusica");


/* =========================================================
   👆 ABRIR INVITACIÓN
========================================================= */

function abrirInvitacion(){

    /*
       La música comienza desde 0:00
    */

    musica.currentTime = 0;

    musica.volume = 1;

    musica.play()
        .then(() => {

            if(botonMusica){
                botonMusica.textContent = "🔊";
            }

        })
        .catch(() => {

            console.log(
                "El navegador bloqueó la reproducción."
            );

        });


    /*
       Quitamos la portada
       con transición.
    */

    const portada =
        document.getElementById("portada");

    const contenido =
        document.getElementById("contenido");


    portada.classList.add("oculta");


    setTimeout(() => {

        contenido.classList.add("visible");

        /*
           Después de abrir,
           bajamos suavemente al inicio.
        */

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    },700);


    /*
       Después de la transición
       quitamos la portada del flujo.
    */

    setTimeout(() => {

        portada.style.display = "none";

    },1100);

}


/* =========================================================
   🔊 CONTROL DE MÚSICA
========================================================= */

function toggleMusica(event){

    /*
       Evita que el botón provoque
       otros eventos.
    */

    if(event){
        event.stopPropagation();
    }


    if(musica.paused){

        musica.play();

        botonMusica.textContent = "🔊";

    }else{

        musica.pause();

        botonMusica.textContent = "🔇";

    }

}


/* =========================================================
   ⏳ CRONÓMETRO
========================================================= */

const fechaXV =
    new Date(
        2026,
        11,
        30,
        0,
        0,
        0
    ).getTime();


function actualizarContador(){

    const ahora =
        new Date().getTime();

    const diferencia =
        fechaXV - ahora;


    if(diferencia <= 0){

        document.getElementById("dias").textContent =
            "0";

        document.getElementById("horas").textContent =
            "0";

        document.getElementById("minutos").textContent =
            "0";

        document.getElementById("segundos").textContent =
            "0";

        return;

    }


    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferencia %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutos =
        Math.floor(
            (diferencia %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const segundos =
        Math.floor(
            (diferencia %
            (1000 * 60)) /
            1000
        );


    document.getElementById("dias").textContent =
        dias;

    document.getElementById("horas").textContent =
        horas;

    document.getElementById("minutos").textContent =
        minutos;

    document.getElementById("segundos").textContent =
        segundos;

}


actualizarContador();

setInterval(
    actualizarContador,
    1000
);

</script>

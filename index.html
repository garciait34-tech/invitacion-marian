<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>XV Años de Marian</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:#06182d;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}


/* =====================================================
   PORTADA
===================================================== */

#portada{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    z-index:5000;
    background:#000;
    cursor:pointer;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#portada img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
}

#portada.oculta{
    opacity:0;
    transform:scale(1.05);
    pointer-events:none;
}


/* =====================================================
   CONTENIDO
===================================================== */

#contenido{
    position:relative;
    width:100%;

    opacity:0;
    transform:translateY(25px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#contenido.visible{
    opacity:1;
    transform:translateY(0);
}


/* =====================================================
   SECCIONES
===================================================== */

.seccion{
    position:relative;
    width:100%;
    margin:0;
    padding:0;
}

.seccion img{
    display:block;
    width:100%;
    height:auto;
    margin:0;
    padding:0;
}


/* =====================================================
   CRONÓMETRO
===================================================== */

.cronometro{
    position:relative;
    width:100%;
    overflow:hidden;
}

.cronometro img{
    display:block;
    width:100%;
    height:auto;
}


/* =====================================================
   CONTADOR
===================================================== */

.contador{
    position:absolute;

    top:64%;
    left:0;

    width:100%;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    text-align:center;

    color:white;

    z-index:50;

    pointer-events:none;
}

.contador .bloque{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

.contador .numero{
    font-size:clamp(25px,6vw,60px);
    font-weight:bold;
    line-height:1;

    text-shadow:
        0 2px 8px rgba(0,0,0,.7);
}

.contador .texto{
    margin-top:6px;

    font-size:clamp(10px,2.8vw,22px);
    font-weight:bold;

    letter-spacing:1px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.7);
}


/* =====================================================
   ROSA
   MÁS GRANDE Y UN POCO MÁS ARRIBA
===================================================== */

.rosa-wrapper{
    position:absolute;

    left:50%;
    bottom:45px;

    width:200px;
    height:350px;

    transform:
        translateX(-50%)
        scale(.72);

    transform-origin:bottom center;

    z-index:20;

    pointer-events:none;
}


/* =====================================================
   CONTENEDOR ORIGINAL DE LA ROSA
===================================================== */

.rosa-wrapper .container{
    position:absolute;

    left:0;
    top:0;

    width:200px;
    height:350px;

    transform:none;
}


/* =====================================================
   CRISTAL
===================================================== */

.rosa-wrapper .glass{
    height:350px;
    width:200px;

    background:#122139;

    border-radius:
        300px 300px 0 0;
}

.rosa-wrapper .glass:before{
    content:"";

    height:10px;
    width:10px;

    transform-origin:center;

    border:10px solid #122139;

    border-radius:100%;

    position:absolute;

    left:87px;
    top:-25px;
}

.rosa-wrapper .glass:after{
    content:"";

    position:absolute;

    height:15px;
    width:250px;

    background:#a52a2a;

    top:100%;
    left:-13%;
}

.rosa-wrapper .shine{
    width:12px;
    height:140px;

    background:white;
    opacity:.2;

    position:absolute;

    left:85%;
    top:80px;

    border-radius:100px;

    z-index:10;
}

.rosa-wrapper .shine:before{
    content:"";

    width:12px;
    height:20px;

    position:absolute;

    background:white;

    top:160px;

    border-radius:100px;
}


/* =====================================================
   PÉTALOS
===================================================== */

.rosa-wrapper .petals > div{
    position:absolute;

    background:#d52d58;

    width:45px;
    height:80px;

    top:55px;

    transition:all .5s ease-out;
}

.rosa-wrapper .petals > div:nth-child(1){
    border-radius:15px;

    box-shadow:
        0 0 30px #f594b8;

    left:80px;
    top:60px;

    background:#d52d58;
}

.rosa-wrapper .petals > div:nth-child(2),
.rosa-wrapper .petals > div:nth-child(4),
.rosa-wrapper .petals > div:nth-child(6){
    background:#b81b43;

    left:60px;

    border-radius:
        0 30px 0 30px;

    transform-origin:bottom right;
}

.rosa-wrapper .petals > div:nth-child(3),
.rosa-wrapper .petals > div:nth-child(5),
.rosa-wrapper .petals > div:nth-child(7){
    background:#b81b43;

    left:100px;

    border-radius:
        30px 0 30px 0;

    transform-origin:bottom left;
}

.rosa-wrapper .petals > div:nth-child(2){
    z-index:5;

    background:#ab1a3f;

    top:75px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:
        bloom2 3s ease-in-out;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(3){
    z-index:4;

    background:#ab1a3f;

    top:75px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:
        bloom3 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(4){
    z-index:3;

    background:#b81b43;

    top:70px;
    height:75px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:
        bloom4 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(5){
    z-index:2;

    background:#b81b43;

    top:70px;
    height:75px;

    box-shadow:
        0 0 50px rgba(245,148,184,.5);

    animation:
        bloom5 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(6){
    z-index:1;

    background:#c9204b;

    top:65px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.3);

    animation:
        bloom6 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(7){
    z-index:0;

    background:#c9204b;

    top:65px;
    height:70px;

    box-shadow:
        0 0 50px rgba(245,148,184,.3);

    animation:
        bloom7 3s ease-in-out,
        glowing 2.5s ease-in-out infinite;

    animation-fill-mode:forwards;
}


/* =====================================================
   PÉTALOS QUE CAEN
===================================================== */

.rosa-wrapper .deadPetals > div{
    position:absolute;

    background:#d52d58;

    width:20px;
    height:15px;

    top:120px;

    border-radius:
        0 30px 0 30px;

    box-shadow:
        0 0 30px rgba(245,148,184,.5);

    transition:all .5s ease-out;
}

.rosa-wrapper .deadPetals > div:nth-child(1){
    left:67px;

    transform:rotate(-30deg);

    animation:
        falling 20s 4s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(2){
    left:104px;

    transform:rotate(-30deg);

    animation:
        falling 20s 8s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(3){
    left:91px;

    transform:rotate(-30deg);

    animation:
        falling 20s 12s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(4){
    left:69px;

    transform:rotate(-30deg);

    animation:
        falling 20s 16s ease-in-out infinite;
}


/* =====================================================
   HOJAS
===================================================== */

.rosa-wrapper .leaves > div:nth-last-child(1){
    position:absolute;

    width:55px;
    height:30px;

    background:#338f37;

    top:120px;
    left:75px;

    border-radius:100px;
}

.rosa-wrapper .leaves > div:nth-child(1){
    position:absolute;

    width:6px;
    height:210px;

    background:#054c05;

    top:95px;
    left:100px;

    border-radius:
        0 0 100px 100px;
}

.rosa-wrapper .leaves > div:nth-child(2){
    position:absolute;

    width:30px;
    height:50px;

    top:180px;
    left:80px;

    border-radius:
        5px 40px 20px 40px;

    background:#054c05;

    transform-origin:bottom;

    transform:rotate(-30deg);

    box-shadow:

}

.rosa-wrapper .leaves > div:nth-child(3){
    position:absolute;

    width:30px;
    height:50px;

    top:150px;
    left:95px;

    border-radius:
        40px 5px 40px 20px;

    background:#054c05;

    transform-origin:bottom;

    transform:rotate(30deg);

    box-shadow:
        inset -5px 5px #066406;
}


/* =====================================================
   ESPINAS
===================================================== */

.rosa-wrapper .thorns > div{
    position:absolute;

    width:0;
    height:0;

    top:140px;
}

.rosa-wrapper .thorns > div:nth-child(odd){
    border-top:
        5px solid transparent;

    border-bottom:
        5px solid transparent;

    border-left:
        5px solid #054c05;

    left:105px;
}

.rosa-wrapper .thorns > div:nth-child(even){
    border-top:
        5px solid transparent;

    border-bottom:
        5px solid transparent;

    border-right:
        5px solid #054c05;

    left:95px;
}

.rosa-wrapper .thorns > div:nth-child(1){
    top:200px;
}

.rosa-wrapper .thorns > div:nth-child(2){
    top:170px;
}

.rosa-wrapper .thorns > div:nth-child(4){
    top:230px;
}


/* =====================================================
   ANIMACIONES DE LA ROSA
===================================================== */

@keyframes bloom2{
    50%{
        transform:rotate(-90deg);
        top:200px;
        left:100px;
    }

    100%{
        transform:rotate(-60deg);
        top:252px;
        left:50px;

        background:#71122a;

        box-shadow:
            0 0 0 rgba(245,148,184,0);
    }
}

@keyframes bloom3{
    100%{
        transform:rotate(45deg);
    }
}

@keyframes bloom4{
    100%{
        transform:rotate(-20deg);
    }
}

@keyframes bloom5{
    100%{
        transform:rotate(20deg);
    }
}

@keyframes bloom6{
    100%{
        transform:rotate(-5deg);
    }
}

@keyframes bloom7{
    100%{
        transform:rotate(5deg);
    }
}

@keyframes glowing{
    50%{
        background:#d7365f;

        box-shadow:
            0 0 60px #f594b8;
    }
}

@keyframes falling{
    20%{
        top:335px;

        background:#9d193b;

        box-shadow:
            0 0 0 rgba(245,148,184,0);
    }

    100%{
        top:335px;
        opacity:0;
    }
}

}


/* =====================================================

===================================================== */

.creditos{

.creditos p{

}

.creditos a{
    color:white;

    text-decoration:none;

    font-weight:bold;
}

.creditos a:hover{
    color:#c9a227;
}


/* =====================================================
   BOTÓN DE MÚSICA
===================================================== */

#botonMusica{
    position:fixed;

    right:15px;
    bottom:15px;

    width:45px;
    height:45px;

    border-radius:50%;

    border:
        2px solid #c9a227;

    background:#17467f;

    color:white;

    font-size:20px;

    z-index:4000;

    cursor:pointer;

    box-shadow:
        0 4px 12px rgba(0,0,0,.4);
}


/* =====================================================
   COPOS DE NIEVE
===================================================== */

.copos-nieve{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:3000;

    overflow:hidden;
}

.copo{
    position:absolute;

    top:-50px;

    color:white;

    font-size:30px;

    opacity:.9;

    text-shadow:
        0 0 8px white,
        0 0 15px rgba(255,255,255,.8);

    animation:
        caer linear infinite;
}

@keyframes caer{
    0%{
        transform:
            translateY(-50px)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(360deg);

        opacity:0;
    }
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    .contador{
        top:64%;
    }

    .contador .numero{
        font-size:25px;
    }

    .contador .texto{
        font-size:11px;
        letter-spacing:.5px;
    }


    /* SOLO CAMBIAMOS LA ROSA */

        bottom:45px;

        transform:
            translateX(-50%)
            scale(.62);
    }


    .boton-confirmar{
        font-size:14px;

        padding:
            12px 22px;

        margin:
            12px auto 22px;
    }

    #botonMusica{
        width:42px;
        height:42px;

        right:12px;
        bottom:12px;

        font-size:18px;
    }

}

</style>

<script>

/* =====================================================
   ABRIR INVITACIÓN
===================================================== */

function abrirInvitacion(){

    const musica =
        document.getElementById("musica");

    const portada =
        document.getElementById("portada");

    const contenido =
        document.getElementById("contenido");


    musica.currentTime = 0;

    musica.volume = 1;

    musica.play().catch(function(){

        console.log(
            "El navegador bloqueó temporalmente el audio."
        );

    });


    portada.classList.add("oculta");


    setTimeout(function(){

        contenido.classList.add("visible");

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    },700);


    setTimeout(function(){

        portada.style.display="none";

    },1100);

}


/* =====================================================
   BOTÓN DE MÚSICA
===================================================== */

function toggleMusica(event){

    event.stopPropagation();

    const musica =
        document.getElementById("musica");

    const boton =
        document.getElementById("botonMusica");


    if(musica.paused){

        musica.play();

        boton.textContent="🔊";

    }else{

        musica.pause();

        boton.textContent="🔇";

    }

}


/* =====================================================
   CUENTA REGRESIVA
===================================================== */

const fechaXV =
    new Date(
        2026,
        11,
        30,
        0,
        0,
        0
    ).getTime();


function actualizarContador(){

    const ahora =
        new Date().getTime();

    const diferencia =
        fechaXV - ahora;


    if(diferencia <= 0){

        document.getElementById("dias").textContent="0";

        document.getElementById("horas").textContent="0";

        document.getElementById("minutos").textContent="0";

        document.getElementById("segundos").textContent="0";

        return;

    }


    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferencia %
                (1000 * 60 * 60 * 24))
            /
            (1000 * 60 * 60)
        );


    const minutos =
        Math.floor(
            (diferencia %
                (1000 * 60 * 60))
            /
            (1000 * 60)
        );


    const segundos =
        Math.floor(
            (diferencia %
                (1000 * 60))
            /
            1000
        );


    document.getElementById("dias")
        .textContent = dias;

    document.getElementById("horas")
        .textContent =
        String(horas).padStart(2,"0");

    document.getElementById("minutos")
        .textContent =
        String(minutos).padStart(2,"0");

    document.getElementById("segundos")
        .textContent =
        String(segundos).padStart(2,"0");

}


actualizarContador();

setInterval(
    actualizarContador,
    1000
);

</script>

</body>
</html>

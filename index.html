<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #071b36;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
  line-height: 0;
}

/* =========================
   NIEVE
========================= */

.nieve {
  position: fixed;
  top: -30px;
  color: white;
  pointer-events: none;
  z-index: 9999;
  animation: caer linear forwards;
  line-height: 1;
}

@keyframes caer {
  from {
    transform: translateY(-30px) rotate(0deg);
  }

  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* =========================
   PORTADA
========================= */

#portada {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;

  background-image: url("portada.jpeg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  z-index: 1000;

  transition:
    opacity 1s ease,
    transform 1s ease;
}

#portada.oculta {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

.abrir {
  margin-bottom: 45px;

  padding: 15px 28px;

  border: 2px solid #FFD700;
  border-radius: 50px;

  background: rgba(7, 27, 54, 0.85);

  color: #FFD700;

  font-size: 20px;
  font-weight: bold;
  line-height: 1.2;

  cursor: pointer;

  box-shadow:
    0 0 15px rgba(255, 215, 0, 0.5);

  animation: pulsar 1.8s infinite;
}

@keyframes pulsar {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.05);
  }
}

/* =========================
   CONTENIDO
========================= */

#contenido {
  display: none;
  width: 100%;
  margin: 0;
  padding: 0;
}

#contenido.mostrar {
  display: block;
  animation: aparecer 1s ease;
}

@keyframes aparecer {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

/* =========================
   TODAS LAS IMÁGENES
========================= */

.seccion {
  width: 100%;
  margin: 0;
  padding: 0;
  display: block;
  overflow: hidden;
}

.seccion img {
  display: block;

  width: 100%;
  max-width: 100%;

  height: auto;

  margin: 0;
  padding: 0;

  object-fit: contain;
}

/* =========================
   CRONÓMETRO
========================= */

.contador {
  position: relative;

  width: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  line-height: 0;
}

/* Imagen del cronómetro */

.imagen-contador {
  display: block;

  width: 100%;
  max-width: 100%;

  height: auto;

  margin: 0;
  padding: 0;

  object-fit: contain;
}

/* Números encima de la imagen */

.numeros-contador {
  position: absolute;

  top: 63%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 92%;

  display: grid;
  grid-template-columns: repeat(4, 1fr);

  text-align: center;

  color: #FFD700;

  line-height: normal;

  text-shadow:
    0 2px 5px #000,
    0 0 10px rgba(255, 215, 0, 0.8);
}

.tiempo {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.numero {
  font-size: clamp(28px, 7vw, 75px);

  font-weight: bold;

  line-height: 1;
}

.etiqueta {
  margin-top: 6px;

  font-size: clamp(8px, 2vw, 17px);

  font-weight: bold;

  letter-spacing: 1px;

  line-height: 1.2;
}

/* =========================
   CONFIRMAR ASISTENCIA
========================= */

.confirmacion {
  width: 100%;

  margin: 0;
  padding: 18px 15px 25px;

  background: #071b36;

  text-align: center;

  line-height: normal;
}

.boton {
  display: inline-block;

  padding: 14px 28px;

  border-radius: 50px;

  background: #FFD700;

  color: #071b36;

  text-decoration: none;

  font-size: 18px;

  font-weight: bold;

  line-height: 1.2;

  box-shadow:
    0 5px 20px rgba(255, 215, 0, 0.4);

  transition: transform 0.3s ease;
}

.boton:hover {
  transform: scale(1.05);
}

/* =========================
   BOTÓN DE MÚSICA
========================= */

#botonMusica {
  position: fixed;

  right: 16px;
  bottom: 16px;

  width: 52px;
  height: 52px;

  border-radius: 50%;

  border: 2px solid #FFD700;

  background: rgba(7, 27, 54, 0.92);

  color: #FFD700;

  font-size: 22px;

  cursor: pointer;

  z-index: 9998;

  line-height: 1;

  box-shadow:
    0 0 15px rgba(255, 215, 0, 0.4);
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

  .abrir {
    margin-bottom: 35px;
    padding: 13px 24px;
    font-size: 17px;
  }

  .numeros-contador {
    width: 96%;
  }

  .numero {
    font-size: clamp(23px, 9vw, 50px);
  }

  .etiqueta {
    font-size: clamp(7px, 2.5vw, 13px);
  }

  .confirmacion {
    padding: 15px 12px 20px;
  }

  .boton {
    font-size: 16px;
    padding: 13px 24px;
  }
}
</style>
</head>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>


<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    background: #071b36;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================================
   NIEVE
========================================= */

.nieve {

    position: fixed;

    top: -30px;

    color: white;

    pointer-events: none;

    z-index: 9999;

    line-height: 1;

    animation: caerNieve linear forwards;
}


@keyframes caerNieve {

    from {
        transform:
            translateY(-30px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }

}


/* =========================================
   ROSAS SOBRE LAS IMÁGENES
========================================= */

.capa-rosas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    pointer-events: none;

    z-index: 5;
}


/* Cada rosa */

.rosa {

    position: absolute;

    line-height: 1;

    opacity: 0.75;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,0.25)
        );

    animation:
        movimientoRosa
        5s ease-in-out infinite;

}


/* Movimiento MUY LEVE */

@keyframes movimientoRosa {

    0% {

        transform:
            translateX(0)
            rotate(-3deg);

    }

    50% {

        transform:
            translateX(8px)
            rotate(4deg);

    }

    100% {

        transform:
            translateX(0)
            rotate(-3deg);

    }

}


/* =========================================
   PORTADA
========================================= */

#portada {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100vh;

    background-image:
        url("portada.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    z-index: 1000;

    overflow: hidden;

    transition:
        opacity 1s ease,
        transform 1s ease;
}


/* Rosas de portada */

#rosasPortada {

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 2;
}


/* Botón abrir */

.abrir {

    position: relative;

    z-index: 10;

    margin-bottom: 45px;

    padding: 15px 28px;

    border:
        2px solid #FFD700;

    border-radius: 50px;

    background:
        rgba(7, 27, 54, 0.90);

    color: #FFD700;

    font-size: 20px;

    font-weight: bold;

    line-height: 1.2;

    cursor: pointer;

    box-shadow:
        0 0 20px
        rgba(255, 215, 0, 0.5);

    animation:
        pulsar 1.8s infinite;
}


@keyframes pulsar {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }

}


/* Ocultar portada */

#portada.oculta {

    opacity: 0;

    transform: scale(1.05);

    pointer-events: none;
}


/* =========================================
   CONTENIDO
========================================= */

#contenido {

    display: none;

    width: 100%;

    margin: 0;
    padding: 0;
}


#contenido.mostrar {

    display: block;

    animation:
        aparecer 1s ease;
}


@keyframes aparecer {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =========================================
   SECCIONES CON IMAGEN
========================================= */

.seccion {

    position: relative;

    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    line-height: 0;
}


.seccion img {

    position: relative;

    z-index: 1;

    display: block;

    width: 100%;

    height: auto;

    max-width: none;

    margin: 0;
    padding: 0;

    border: 0;
}


/* =========================================
   CRONÓMETRO
========================================= */

.contador {

    position: relative;

    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    line-height: 0;
}


/* Imagen del cronómetro */

.imagen-contador {

    position: relative;

    z-index: 1;

    display: block;

    width: 100%;

    height: auto;

    max-width: none;

    margin: 0;
    padding: 0;

    border: 0;
}


/* =========================================
   NÚMEROS DEL CRONÓMETRO
========================================= */

.numeros-contador {

    position: absolute;

    top: 63%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 92%;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    text-align: center;

    color: #FFD700;

    line-height: normal;

    z-index: 10;

    text-shadow:
        0 2px 5px #000,
        0 0 10px
        rgba(255, 215, 0, 0.8);
}


.tiempo {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


.numero {

    font-size:
        clamp(28px, 7vw, 75px);

    font-weight: bold;

    line-height: 1;
}


.etiqueta {

    margin-top: 7px;

    font-size:
        clamp(8px, 2vw, 17px);

    font-weight: bold;

    letter-spacing: 1px;

    line-height: 1.2;
}


/* =========================================
   CONFIRMAR ASISTENCIA
========================================= */

.confirmacion {

    width: 100%;

    margin: 0;

    padding:
        18px 15px 25px;

    background:
        #071b36;

    text-align: center;

    line-height: normal;
}


.boton {

    display: inline-block;

    padding:
        15px 30px;

    border-radius: 50px;

    background:
        #FFD700;

    color:
        #071b36;

    text-decoration: none;

    font-size: 18px;

    font-weight: bold;

    line-height: 1.2;

    box-shadow:
        0 5px 20px
        rgba(255, 215, 0, 0.4);

    transition:
        transform 0.2s ease;
}


.boton:hover {

    transform:
        scale(1.05);
}


.boton:active {

    transform:
        scale(0.96);
}


/* =========================================
   BOTÓN DE MÚSICA
========================================= */

#botonMusica {

    position: fixed;

    right: 16px;
    bottom: 16px;

    width: 52px;
    height: 52px;

    border-radius: 50%;

    border:
        2px solid #FFD700;

    background:
        rgba(7, 27, 54, 0.95);

    color:
        #FFD700;

    font-size: 22px;

    cursor: pointer;

    z-index: 9998;

    line-height: 1;

    box-shadow:
        0 0 15px
        rgba(255, 215, 0, 0.4);
}


/* =========================================
   CELULAR
========================================= */

@media (max-width: 600px) {

    .abrir {

        margin-bottom: 35px;

        padding:
            13px 24px;

        font-size: 17px;
    }


    .numeros-contador {

        width: 96%;
    }


    .numero {

        font-size:
            clamp(22px, 9vw, 50px);
    }


    .etiqueta {

        font-size:
            clamp(7px, 2.5vw, 13px);

        letter-spacing: 0;
    }


    .confirmacion {

        padding:
            15px 10px 20px;
    }


    .boton {

        font-size: 16px;

        padding:
            13px 24px;
    }

}

</style>
</head>


<body>


<!-- =========================================
     PORTADA
========================================= -->

<div
    id="portada"
    onclick="abrirInvitacion()"
>


    <!-- ROSAS DE LA PORTADA -->

    <div id="rosasPortada"></div>


    <!-- BOTÓN -->

    <div class="abrir">

        ✨ Toca para abrir ✨

    </div>


</div>


<!-- =========================================
     MÚSICA
========================================= -->

<audio
    id="musica"
    loop
    preload="auto"
>

    <source
        src="./musica.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =========================================
     CONTENIDO
========================================= -->

<main id="contenido">


    <!-- =====================================
         1. INICIO
    ====================================== -->

    <section class="seccion">

        <img
            src="inicio.jpeg"
            alt="Inicio de la invitación"
        >

        <div class="capa-rosas"></div>

    </section>


    <!-- =====================================
         2. INVITACIÓN
    ====================================== -->

    <section class="seccion">

        <img
            src="invitacion.jpeg"
            alt="Invitación de Marian"
        >

        <div class="capa-rosas"></div>

    </section>


    <!-- =====================================
         3. DETALLES
    ====================================== -->

    <section class="seccion">

        <img
            src="detalles.jpeg"
            alt="Detalles de los XV años"
        >

        <div class="capa-rosas"></div>

    </section>


    <!-- =====================================
         4. CRONÓMETRO
    ====================================== -->

    <section class="contador">


        <!-- IMAGEN DEL CRONÓMETRO -->

        <img
            class="imagen-contador"
            src="cronometro.jpeg"
            alt="Una noche soñada está por comenzar"
        >


        <!-- ROSAS -->

        <div class="capa-rosas"></div>


        <!-- NÚMEROS -->

        <div class="numeros-contador">


            <!-- DÍAS -->

            <div class="tiempo">

                <span
                    id="dias"
                    class="numero"
                >
                    0
                </span>

                <span class="etiqueta">
                    DÍAS
                </span>

            </div>


            <!-- HORAS -->

            <div class="tiempo">

                <span
                    id="horas"
                    class="numero"
                >
                    00
                </span>

                <span class="etiqueta">
                    HORAS
                </span>

            </div>


            <!-- MINUTOS -->

            <div class="tiempo">

                <span
                    id="minutos"
                    class="numero"
                >
                    00
                </span>

                <span class="etiqueta">
                    MINUTOS
                </span>

            </div>


            <!-- SEGUNDOS -->

            <div class="tiempo">

                <span
                    id="segundos"
                    class="numero"
                >
                    00
                </span>

                <span class="etiqueta">
                    SEGUNDOS
                </span>

            </div>


        </div>


    </section>


    <!-- =====================================
         5. CONFIRMAR ASISTENCIA
    ====================================== -->

    <section class="seccion">

        <img
            src="confirmar.jpeg"
            alt="Confirmar asistencia"
        >

        <div class="capa-rosas"></div>

    </section>


    <!-- =====================================
         BOTÓN WHATSAPP
    ====================================== -->

    <section class="confirmacion">

        <a
            class="boton"
            href="https://wa.me/522821424816"
            target="_blank"
            rel="noopener noreferrer"
        >

            💌 Confirmar asistencia

        </a>

    </section>


    <!-- =====================================
         6. FINAL
    ====================================== -->

    <section class="seccion">

        <img
            src="final.jpeg"
            alt="Gracias por acompañarme"
        >

        <div class="capa-rosas"></div>

    </section>


</main>


<!-- =========================================
     BOTÓN DE MÚSICA
========================================= -->

<button
    id="botonMusica"
    onclick="controlarMusica(event)"
    aria-label="Controlar música"
>

    🎵

</button>


<script>


/* =========================================
   ABRIR INVITACIÓN
========================================= */

function abrirInvitacion() {

    const portada =
        document.getElementById("portada");

    const contenido =
        document.getElementById("contenido");

    const musica =
        document.getElementById("musica");


    /* Ocultar portada */

    portada.classList.add("oculta");


    /* Mostrar contenido */

    contenido.classList.add("mostrar");


    /* Música desde 0:00 */

    musica.currentTime = 0;

    musica.volume = 1;


    musica.play()
        .then(function() {

            document.getElementById(
                "botonMusica"
            ).textContent = "🎵";

        })
        .catch(function(error) {

            console.log(
                "No se pudo reproducir la música:",
                error
            );

        });


    /* Iniciar rosas */

    iniciarRosas();

}


/* =========================================
   CONTROL DE MÚSICA
========================================= */

function controlarMusica(event) {

    event.stopPropagation();

    const musica =
        document.getElementById("musica");

    const boton =
        document.getElementById("botonMusica");


    if (musica.paused) {

        musica.play();

        boton.textContent = "🎵";

    } else {

        musica.pause();

        boton.textContent = "🔇";

    }

}


/* =========================================
   CRONÓMETRO
========================================= */

const fechaXV =
    new Date(
        2026,
        11,
        30,
        0,
        0,
        0
    ).getTime();


function actualizarContador() {

    const ahora =
        new Date().getTime();

    const diferencia =
        fechaXV - ahora;


    if (diferencia <= 0) {

        document.getElementById(
            "dias"
        ).textContent = "0";

        document.getElementById(
            "horas"
        ).textContent = "00";

        document.getElementById(
            "minutos"
        ).textContent = "00";

        document.getElementById(
            "segundos"
        ).textContent = "00";

        return;
    }


    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferencia %
                (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutos =
        Math.floor(
            (diferencia %
                (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const segundos =
        Math.floor(
            (diferencia %
                (1000 * 60)) /
            1000
        );


    document.getElementById(
        "dias"
    ).textContent = dias;


    document.getElementById(
        "horas"
    ).textContent =
        String(horas)
        .padStart(2, "0");


    document.getElementById(
        "minutos"
    ).textContent =
        String(minutos)
        .padStart(2, "0");


    document.getElementById(
        "segundos"
    ).textContent =
        String(segundos)
        .padStart(2, "0");

}


/* Iniciar cronómetro */

actualizarContador();


/* Actualizar cada segundo */

setInterval(
    actualizarContador,
    1000
);


/* =========================================
   CREAR ROSA
========================================= */

function crearRosa(contenedor) {

    const rosa =
        document.createElement("div");


    rosa.className =
        "rosa";


    /* Rosa roja */

    rosa.textContent =
        "🌹";


    /* Posición */

    rosa.style.left =
        Math.random() * 90 + 5 + "%";


    /*
       Posición vertical aleatoria
       para que no estén todas juntas
    */

    rosa.style.top =
        Math.random() * 80 + 10 + "%";


    /* Tamaño */

    const tamaño =
        18 +
        Math.random() * 22;


    rosa.style.fontSize =
        tamaño + "px";


    /*
       Cada rosa tendrá una
       velocidad ligeramente distinta
    */

    rosa.style.animationDuration =
        (4 + Math.random() * 3) + "s";


    /*
       Retraso para que no se
       muevan todas al mismo tiempo
    */

    rosa.style.animationDelay =
        (-Math.random() * 5) + "s";


    contenedor.appendChild(
        rosa
    );

}


/* =========================================
   INICIAR ROSAS
========================================= */

function iniciarRosas() {


    /* Rosas de portada */

    const rosasPortada =
        document.getElementById(
            "rosasPortada"
        );


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        crearRosa(
            rosasPortada
        );

    }


    /*
       Rosas de todas las imágenes
    */

    const capas =
        document.querySelectorAll(
            ".capa-rosas"
        );


    capas.forEach(
        function(capa) {


            /*
               Crear rosas iniciales
            */

            for (
                let i = 0;
                i < 6;
                i++
            ) {

                crearRosa(
                    capa
                );

            }


            /*
               Agregar una nueva rosa
               cada cierto tiempo
            */

            setInterval(
                function() {

                    crearRosa(
                        capa
                    );

                },
                3500
            );

        }
    );


    /*
       Nuevas rosas en portada
    */

    setInterval(
        function() {

            crearRosa(
                rosasPortada
            );

        },
        3500
    );

}


/* =========================================
   NIEVE
========================================= */

const simbolosNieve = [

    "❄",
    "❅",
    "❆",
    "✦",
    "•"

];


function crearNieve() {

    const elemento =
        document.createElement("div");


    elemento.className =
        "nieve";


    elemento.textContent =
        simbolosNieve[
            Math.floor(
                Math.random() *
                simbolosNieve.length
            )
        ];


    elemento.style.left =
        Math.random() * 100 + "vw";


    elemento.style.fontSize =
        (
            8 +
            Math.random() * 15
        ) + "px";


    elemento.style.animationDuration =
        (
            5 +
            Math.random() * 8
        ) + "s";


    elemento.style.opacity =
        0.3 +
        Math.random() * 0.7;


    document.body.appendChild(
        elemento
    );


    setTimeout(
        function() {

            elemento.remove();

        },
        14000
    );

}


/* Crear nieve */

setInterval(
    crearNieve,
    350
);


</script>


</body>
</html>

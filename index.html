<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  background:#fff;
  font-family:Arial, Helvetica, sans-serif;
  overflow-x:hidden;
}

.seccion{
  position:relative;
  width:100%;
  margin:0;
  padding:0;
}

.seccion img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}


/* =========================================================
   PORTADA
========================================================= */

.portada{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  cursor:pointer;
}

.portada img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.portada-overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:50px;
  z-index:20;
}

.boton-abrir{
  background:rgba(255,255,255,.92);
  color:#173f78;
  border:2px solid #c9a227;
  border-radius:50px;
  padding:14px 35px;
  font-size:16px;
  font-weight:bold;
  letter-spacing:1px;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
  animation:pulsoBoton 2s infinite;
}

@keyframes pulsoBoton{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.05);
  }

}


/* =========================================================
   BOTÓN DE MÚSICA
========================================================= */

.boton-musica{
  position:fixed;
  right:18px;
  bottom:18px;

  width:48px;
  height:48px;

  border-radius:50%;

  border:2px solid #c9a227;

  background:rgba(255,255,255,.92);

  color:#17467f;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;

  cursor:pointer;

  z-index:10000;

  box-shadow:0 4px 15px rgba(0,0,0,.25);
}


/* =========================================================
   SECCIONES
========================================================= */

.inicio,
.invitacion,
.detalles,
.confirmar,
.final{
  position:relative;
  width:100%;
}


/* =========================================================
   CRONÓMETRO
========================================================= */

.cronometro{
  position:relative;
  width:100%;
  overflow:hidden;
}

.cronometro > img{
  width:100%;
  height:auto;
  display:block;
}


/* =========================================================
   CONTADOR
========================================================= */

.contador{
  position:absolute;

  left:50%;
  top:59%;

  transform:translate(-50%,-50%);

  width:92%;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:10px;

  z-index:50;
}

.contador-item{
  min-width:65px;
  text-align:center;
}

.contador-numero{
  font-size:clamp(22px,5vw,45px);
  font-weight:bold;
  color:#fff;

  text-shadow:
    0 2px 5px rgba(0,0,0,.6),
    0 0 10px rgba(255,255,255,.4);
}

.contador-texto{
  font-size:clamp(8px,2vw,13px);
  color:#fff;
  font-weight:bold;
  letter-spacing:1px;

  text-shadow:
    0 2px 4px rgba(0,0,0,.7);
}


/* =========================================================
   🌹 ROSA ORIGINAL
========================================================= */

.rosa-wrapper{
  position:absolute;

  left:50%;
  bottom:0;

  transform:translateX(-50%);

  width:260px;
  height:380px;

  z-index:200;

  pointer-events:none;
}


/* CONTENEDOR ORIGINAL DE LA ROSA */

.rosa-wrapper .container{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:250px;
  height:370px;
}


/* =========================================================
   GLASS
========================================================= */

.rosa-wrapper .glass{
  height:350px;
  width:200px;

  background:#122139;

  border-radius:300px 300px 0px 0px;

  position:absolute;
  left:25px;
  top:0;

  opacity:.82;
}

.rosa-wrapper .glass:before{

  content:"";

  height:10px;
  width:10px;

  transform-origin:center;

  border:10px solid #122139;

  border-radius:100%;

  position:absolute;

  left:87px;
  top:-25px;
}

.rosa-wrapper .glass:after{

  content:"";

  position:absolute;

  height:15px;
  width:250px;

  background:#a52a2a;

  top:100%;
  left:-13%;
}


/* =========================================================
   SHINE
========================================================= */

.rosa-wrapper .shine{

  width:12px;
  height:140px;

  background:white;

  opacity:.2;

  position:absolute;

  left:85%;
  top:80px;

  border-radius:100px;

  z-index:10;
}

.rosa-wrapper .shine:before{

  content:"";

  width:12px;
  height:20px;

  position:absolute;

  background:white;

  top:160px;

  border-radius:100px;
}


/* =========================================================
   PÉTALOS
========================================================= */

.rosa-wrapper .petals > div{

  position:absolute;

  background:#d52d58;

  width:45px;
  height:80px;

  top:55px;

  transition:all .5s ease-out;
}

.rosa-wrapper .petals > div:nth-child(1){

  border-radius:15px;

  box-shadow:0px 0px 30px #f594b8;

  left:80px;
  top:60px;

  background:#d52d58;
}

.rosa-wrapper .petals > div:nth-child(2),
.rosa-wrapper .petals > div:nth-child(4),
.rosa-wrapper .petals > div:nth-child(6){

  background:#b81b43;

  left:60px;

  border-radius:0px 30px 0px 30px;

  transform-origin:bottom right;
}

.rosa-wrapper .petals > div:nth-child(3),
.rosa-wrapper .petals > div:nth-child(5),
.rosa-wrapper .petals > div:nth-child(7){

  background:#b81b43;

  left:100px;

  border-radius:30px 0px 30px 0px;

  transform-origin:bottom left;
}

.rosa-wrapper .petals > div:nth-child(2){

  z-index:5;

  background:#ab1a3f;

  top:75px;
  height:70px;

  box-shadow:0px 0px 50px rgba(245,148,184,.5);

  animation:bloom2 3s ease-in-out;

  animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(3){

  z-index:4;

  background:#ab1a3f;

  top:75px;
  height:70px;

  box-shadow:0px 0px 50px rgba(245,148,184,.5);

  animation:
    bloom3 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(4){

  z-index:3;

  background:#b81b43;

  top:70px;
  height:75px;

  box-shadow:0px 0px 50px rgba(245,148,184,.5);

  animation:
    bloom4 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(5){

  z-index:2;

  background:#b81b43;

  top:70px;
  height:75px;

  box-shadow:0px 0px 50px rgba(245,148,184,.5);

  animation:
    bloom5 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(6){

  z-index:1;

  background:#c9204b;

  top:65px;
  height:70px;

  box-shadow:0px 0px 50px rgba(245,148,184,.3);

  animation:
    bloom6 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

.rosa-wrapper .petals > div:nth-child(7){

  z-index:0;

  background:#c9204b;

  top:65px;
  height:70px;

  box-shadow:0px 0px 50px rgba(245,148,184,.3);

  animation:
    bloom7 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}


/* =========================================================
   PÉTALOS QUE CAEN
========================================================= */

.rosa-wrapper .deadPetals > div{

  position:absolute;

  background:#d52d58;

  width:20px;
  height:15px;

  top:120px;

  border-radius:0px 30px 0px 30px;

  box-shadow:0px 0px 30px rgba(245,148,184,.5);

  transition:all .5s ease-out;
}

.rosa-wrapper .deadPetals > div:nth-child(1){

  left:67px;

  transform:rotate(-30deg);

  animation:
    falling 20s 4s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(2){

  left:104px;

  transform:rotate(-30deg);

  animation:
    falling 20s 8s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(3){

  left:91px;

  transform:rotate(-30deg);

  animation:
    falling 20s 12s ease-in-out infinite;
}

.rosa-wrapper .deadPetals > div:nth-child(4){

  left:69px;

  transform:rotate(-30deg);

  animation:
    falling 20s 16s ease-in-out infinite;
}


/* =========================================================
   HOJAS
========================================================= */

.rosa-wrapper .leaves > div:nth-last-child(1){

  position:absolute;

  width:55px;
  height:30px;

  background:#338f37;

  top:120px;
  left:75px;

  border-radius:100px;
}

.rosa-wrapper .leaves > div:nth-child(1){

  position:absolute;

  width:6px;
  height:210px;

  background:#054c05;

  top:95px;
  left:100px;

  border-radius:0 0 100px 100px;
}

.rosa-wrapper .leaves > div:nth-child(2){

  position:absolute;

  width:30px;
  height:50px;

  border-radius:5px 40px 20px 40px;

  background:#054c05;

  transform-origin:bottom;

  transform:rotate(-30deg);

  top:180px;
  left:80px;

  box-shadow:inset 5px 5px #066406;
}

.rosa-wrapper .leaves > div:nth-child(3){

  position:absolute;

  width:30px;
  height:50px;

  border-radius:40px 5px 40px 20px;

  background:#054c05;

  transform-origin:bottom;

  transform:rotate(30deg);

  top:150px;
  left:95px;

  box-shadow:inset -5px 5px #066406;
}


/* =========================================================
   ESPINAS
========================================================= */

.rosa-wrapper .thorns > div{

  position:absolute;

  width:0;
  height:0;

  top:140px;
}

.rosa-wrapper .thorns > div:nth-child(odd){

  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-left:5px solid #054c05;

  left:105px;
}

.rosa-wrapper .thorns > div:nth-child(even){

  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-right:5px solid #054c05;

  left:95px;
}

.rosa-wrapper .thorns > div:nth-child(1){
  top:200px;
}

.rosa-wrapper .thorns > div:nth-child(2){
  top:170px;
}

.rosa-wrapper .thorns > div:nth-child(4){
  top:230px;
}


/* =========================================================
   ANIMACIONES ORIGINALES DE LA ROSA
========================================================= */

@keyframes bloom2{

  50%{
    transform:rotate(-90deg);
    top:200px;
    left:100px;
  }

  100%{
    transform:rotate(-60deg);
    top:252px;
    left:50px;

    background:#71122a;

    box-shadow:0px 0px 0px rgba(245,148,184,0);
  }
}

@keyframes bloom3{

  100%{
    transform:rotate(45deg);
  }
}

@keyframes bloom4{

  100%{
    transform:rotate(-20deg);
  }
}

@keyframes bloom5{

  100%{
    transform:rotate(20deg);
  }
}

@keyframes bloom6{

  100%{
    transform:rotate(-5deg);
  }
}

@keyframes bloom7{

  100%{
    transform:rotate(5deg);
  }
}

@keyframes glowing{

  50%{

    background:#d7365f;

    box-shadow:0px 0px 60px #f594b8;
  }
}

@keyframes falling{

  20%{

    top:335px;

    background:#9d193b;

    box-shadow:0px 0px 0px rgba(245,148,184,0);
  }

  100%{

    top:335px;

    opacity:0;
  }
}


/* =========================================================
   ❄️ COPOS DE NIEVE
========================================================= */

.copos-nieve{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  overflow:hidden;

  z-index:9999;
}

.copos-nieve span{

  position:absolute;

  top:-40px;

  color:white;

  font-family:Arial,sans-serif;

  line-height:1;

  opacity:.85;

  text-shadow:
    0 0 4px rgba(255,255,255,.9),
    0 0 8px rgba(255,255,255,.7);

  animation-name:nieveCaer;

  animation-timing-function:linear;

  animation-iteration-count:infinite;
}


/* posiciones de los copos */

.copos-nieve span:nth-child(1){

  font-size:14px;
  animation-duration:8s;

}

}

.copos-nieve span:nth-child(10){
  left:63%;

}

.copos-nieve span:nth-child(11){

.copos-nieve span:nth-child(12){

.copos-nieve span:nth-child(13){

.copos-nieve span:nth-child(14){

.copos-nieve span:nth-child(15){

.copos-nieve span:nth-child(16){
  left:97%;

.copos-nieve span:nth-child(17){

.copos-nieve span:nth-child(18){

}

.copos-nieve span:nth-child(19){

}


/* =========================================================
   ANIMACIÓN NIEVE
========================================================= */

@keyframes nieveCaer{

  0%{

    transform:
      translate3d(0,-50px,0)
      rotate(0deg);

    opacity:0;
  }

  10%{
    opacity:.9;
  }

  50%{

    transform:
      translate3d(35px,50vh,0)
      rotate(180deg);

    opacity:.8;
  }

  100%{

    transform:
      translate3d(-30px,110vh,0)
      rotate(360deg);

    opacity:0;
  }
}


/* =========================================================
   CONFIRMACIÓN
========================================================= */

.boton-whatsapp{

  margin:20px auto;

  padding:15px 30px;

/* =========================================================
   CRÉDITOS
========================================================= */

.creditos{

  width:100%;

  padding:35px 20px 45px;

  text-align:center;

  background:#fff;

}

.credito-titulo{

  font-size:12px;

/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:600px){

  .contador{
    gap:3px;

  }

  }

  .rosa-wrapper{

    width:230px;
    height:350px;

    transform:translateX(-50%) scale(.82);

    transform-origin:bottom center;
  }

}

<script>

/* =========================================================
   🎵 MÚSICA
========================================================= */

const musica = document.getElementById("musica");

const botonMusica =
  document.getElementById("botonMusica");


function abrirInvitacion(){

  /*
    Reiniciamos la música desde 0:00
  */

  musica.currentTime = 0;

  musica.volume = 1;

  musica.play()
    .then(() => {

      botonMusica.textContent = "🔊";

    })
    .catch(() => {

      console.log("El navegador bloqueó la reproducción.");

    });

}


/* =========================================================
   CONTROL DE MÚSICA
========================================================= */

function toggleMusica(){

  if(musica.paused){

    musica.play();

    botonMusica.textContent = "🔊";

  }else{

    musica.pause();

    botonMusica.textContent = "🔇";

  }

}


/* =========================================================
   ⏳ CRONÓMETRO
========================================================= */

const fechaXV =
  new Date(
    2026,
    11,
    30,
    0,
    0,
    0
  ).getTime();


function actualizarContador(){

  const ahora =
    new Date().getTime();

  const diferencia =
    fechaXV - ahora;


  if(diferencia <= 0){

    document.getElementById("dias").textContent =
      "0";

    document.getElementById("horas").textContent =
      "0";

    document.getElementById("minutos").textContent =
      "0";

    document.getElementById("segundos").textContent =
      "0";

    return;

  }


  const dias =
    Math.floor(
      diferencia /
      (1000 * 60 * 60 * 24)
    );


  const horas =
    Math.floor(
      (diferencia %
      (1000 * 60 * 60 * 24)) /
      (1000 * 60 * 60)
    );


  const minutos =
    Math.floor(
      (diferencia %
      (1000 * 60 * 60)) /
      (1000 * 60)
    );


  const segundos =
    Math.floor(
      (diferencia %
      (1000 * 60)) /
      1000
    );


  document.getElementById("dias").textContent =
    dias;

  document.getElementById("horas").textContent =
    horas;

  document.getElementById("minutos").textContent =
    minutos;

  document.getElementById("segundos").textContent =
    segundos;

}


actualizarContador();

setInterval(
  actualizarContador,
  1000
);

</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #061b3a;
  overflow-x: hidden;
  font-family: Georgia, "Times New Roman", serif;
}

body {
  position: relative;
}


/* =====================================================
   PORTADA
===================================================== */

#portada {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100vh;

  background-image: url("portada.jpeg");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  z-index: 1000;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  cursor: pointer;

  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}

#portada.cerrada {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}


/* =====================================================
   TOCA PARA ABRIR
===================================================== */

.abrir {
  margin-bottom: 55px;

  padding: 14px 28px;

  color: #fff;

  font-size: 18px;
  letter-spacing: 1px;
  text-align: center;

  background: rgba(4, 20, 50, 0.72);

  border: 1px solid rgba(255, 215, 120, 0.8);

  border-radius: 30px;

  box-shadow:
    0 0 15px rgba(255, 215, 120, 0.35);

  animation: pulsar 2s ease-in-out infinite;
}

@keyframes pulsar {

  0%,
  100% {
    transform: scale(1);
    opacity: .85;
  }

  50% {
    transform: scale(1.04);
    opacity: 1;
  }
}


/* =====================================================
   CONTENIDO
===================================================== */

#contenido {
  width: 100%;
  margin: 0;
  padding: 0;
}


/* =====================================================
   SECCIONES
===================================================== */

.seccion {
  position: relative;

  width: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;
}

.seccion img {
  display: block;

  width: 100%;
  height: auto;

  margin: 0;
  padding: 0;
}


/* =====================================================
   CRONÓMETRO
===================================================== */

.contador {
  position: relative;

  width: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;
}

.imagen-contador {
  display: block;

  width: 100%;
  height: auto;

  margin: 0;
  padding: 0;
}


/* =====================================================
   CÚPULA DE LA ROSA
   ARRIBA DEL CRONÓMETRO
===================================================== */

.cupula-rosa {

  position: absolute;

  left: 50%;

  /*
     MUY ARRIBA para no tapar
     el contador.
  */

  top: 2%;

  transform: translateX(-50%);

  /*
     Más pequeña para que sea
     solamente un adorno.
  */

  width: min(34vw, 250px);

  height: min(40vw, 300px);

  z-index: 10;

  pointer-events: none;
}


/* =====================================================
   VIDRIO
===================================================== */

.vidrio {

  position: absolute;

  inset: 0;

  border-radius:
    50% 50% 15% 15% /
    32% 32% 7% 7%;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.10),
      rgba(255,255,255,.025)
    );

  border:
    1.5px solid rgba(255,255,255,.52);

  box-shadow:

    inset 5px 0 15px rgba(255,255,255,.12),

    inset -5px 0 15px rgba(255,255,255,.08),

    0 0 18px rgba(255,255,255,.13);

  backdrop-filter: blur(1px);
}


/* =====================================================
   REFLEJO DEL VIDRIO
===================================================== */

.vidrio::before {

  content: "";

  position: absolute;

  top: 8%;
  left: 12%;

  width: 6%;
  height: 52%;

  border-radius: 50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.75),
      rgba(255,255,255,0)
    );

  transform: rotate(7deg);

  opacity: .55;
}


.vidrio::after {

  content: "";

  position: absolute;

  top: 18%;
  right: 12%;

  width: 3%;
  height: 30%;

  border-radius: 50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.4),
      transparent
    );

  transform: rotate(-8deg);

  opacity: .35;
}


/* =====================================================
   BASE DEL VIDRIO
===================================================== */

.base-vidrio {

  position: absolute;

  left: -5%;
  bottom: -1%;

  width: 110%;
  height: 9%;

  border-radius: 50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.28),
      rgba(255,255,255,.06)
    );

  border:
    1.5px solid rgba(255,255,255,.5);

  box-shadow:
    inset 0 2px 6px rgba(255,255,255,.2),
    0 3px 9px rgba(0,0,0,.3);
}


/* =====================================================
   ROSA ROJA
===================================================== */

.rosa-neon {

  position: absolute;

  left: 50%;
  top: 16%;

  width: 72%;

  transform: translateX(-50%);

  z-index: 5;

  animation:
    respirarRosa 4s ease-in-out infinite;
}


@keyframes respirarRosa {

  0%,
  100% {
    transform:
      translateX(-50%)
      scale(1);
  }

  50% {
    transform:
      translateX(-50%)
      scale(1.025);
  }
}


/* =====================================================
   SVG ROSA
===================================================== */

.rosa-svg {

  display: block;

  width: 100%;
  height: auto;

  overflow: visible;
}


/* Brillo de la rosa */

.brillo-rosa {

  filter:
    drop-shadow(0 0 2px #ff173f)
    drop-shadow(0 0 5px #ff173f)
    drop-shadow(0 0 9px rgba(255,20,55,.7));
}


/* =====================================================
   TALLO
===================================================== */

.tallo {

  position: absolute;

  left: 50%;
  top: 62%;

  width: 3px;
  height: 30%;

  background:
    linear-gradient(
      to right,
      #bcbcbc,
      #ffffff,
      #8f8f8f
    );

  border-radius: 100%;

  transform:
    translateX(-50%)
    rotate(4deg);

  box-shadow:
    0 0 3px rgba(255,255,255,.7);
}


/* =====================================================
   PÉTALOS QUE CAEN
===================================================== */

.petalo {

  position: absolute;

  z-index: 20;

  width: 8px;
  height: 12px;

  border-radius:
    70% 30% 70% 30%;

  background:
    linear-gradient(
      135deg,
      #ff5068,
      #dc0b32 55%,
      #800016
    );

  box-shadow:
    0 0 4px rgba(255,30,65,.5);

  opacity: 0;

  animation:
    caerPetalo linear forwards;
}


@keyframes caerPetalo {

  0% {

    opacity: 0;

    transform:
      translateY(-10px)
      translateX(0)
      rotate(0deg);
  }

  10% {
    opacity: .9;
  }

  40% {

    transform:
      translateY(65px)
      translateX(12px)
      rotate(100deg);
  }

  70% {

    transform:
      translateY(130px)
      translateX(-10px)
      rotate(220deg);
  }

  100% {

    opacity: 0;

    transform:
      translateY(210px)
      translateX(8px)
      rotate(330deg);
  }
}


/* =====================================================
   CONTADOR
===================================================== */

.numeros-contador {

  position: absolute;

  left: 50%;
  bottom: 5%;

  transform: translateX(-50%);

  z-index: 30;

  width: 92%;

  display: flex;

  justify-content: center;

  gap: 8px;

  text-align: center;
}


.numero {

  min-width: 62px;

  padding: 7px 4px;

  border-radius: 10px;

  background:
    rgba(4,20,50,.65);

  border:
    1px solid rgba(255,215,120,.65);

  box-shadow:
    0 4px 12px rgba(0,0,0,.28);
}


.numero span {

  display: block;

  color: #fff;

  font-size:
    clamp(19px,5vw,36px);

  font-weight: bold;

  line-height: 1;

  text-shadow:
    0 2px 5px rgba(0,0,0,.7);
}


.numero small {

  display: block;

  margin-top: 5px;

  color: #f7d77a;

  font-size:
    clamp(7px,2vw,11px);

  letter-spacing: .8px;
}


/* =====================================================
   CONFIRMACIÓN
===================================================== */

.confirmacion {

  width: 100%;

  padding: 25px 15px;

  text-align: center;

  background:
    linear-gradient(
      180deg,
      #061b3a,
      #092a58
    );
}


.boton {

  display: inline-block;

  padding: 14px 25px;

  color: #fff;

  text-decoration: none;

  font-size: 17px;

  font-weight: bold;

  border-radius: 30px;

  background:
    linear-gradient(
      135deg,
      #0d5d8c,
      #147ca8
    );

  border:
    1px solid #e7c76b;

  box-shadow:
    0 5px 18px rgba(0,0,0,.3);
}


/* =====================================================
   BOTÓN DE MÚSICA
===================================================== */

#botonMusica {

  position: fixed;

  right: 18px;
  bottom: 18px;

  width: 48px;
  height: 48px;

  z-index: 999;

  border:
    1px solid rgba(255,215,120,.8);

  border-radius: 50%;

  background:
    rgba(4,20,50,.82);

  color: #f7d77a;

  font-size: 20px;

  cursor: pointer;

  box-shadow:
    0 4px 12px rgba(0,0,0,.3);
}


/* =====================================================
   NIEVE
===================================================== */

.nieve {

  position: fixed;

  top: -30px;

  z-index: 500;

  pointer-events: none;

  color: #fff;

  text-shadow:
    0 0 5px rgba(255,255,255,.9);

  animation-name: caerNieve;

  animation-timing-function: linear;

  animation-fill-mode: forwards;
}


@keyframes caerNieve {

  0% {
    transform:
      translateY(-30px)
      rotate(0deg);
  }

  100% {
    transform:
      translateY(110vh)
      rotate(360deg);
  }
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 600px) {

  /*
     En celular la hacemos todavía
     más pequeña y arriba.
  */

  .cupula-rosa {

    width: 31vw;

    height: 38vw;

    top: 2%;
  }

  .rosa-neon {

    top: 16%;

    width: 70%;
  }

  .numeros-contador {

    gap: 3px;
  }

  .numero {

    min-width: 54px;

    padding: 6px 3px;
  }

  .numero span {

    font-size: 20px;
  }

  .numero small {

    font-size: 7px;
  }

  .abrir {

    margin-bottom: 35px;

    font-size: 16px;
  }
}

</style>

<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const musica =
  document.getElementById("musica");

const portada =
  document.getElementById("portada");


/* =====================================================
   ABRIR INVITACIÓN
===================================================== */

function abrirInvitacion() {

  musica.currentTime = 0;

  musica.volume = 1;

  musica.play().catch(
    function(error) {

      console.log(
        "El navegador bloqueó el audio:",
        error
      );

    }
  );


  portada.classList.add("cerrada");


  iniciarPetalos();
}


/* =====================================================
   MÚSICA
===================================================== */

function alternarMusica() {

  if (musica.paused) {

    musica.play();

    document
      .getElementById("botonMusica")
      .textContent = "🎵";

  } else {

    musica.pause();

    document
      .getElementById("botonMusica")
      .textContent = "🔇";
  }

}


/* =====================================================
   CRONÓMETRO
===================================================== */

const fechaXV =
  new Date(
    2026,
    11,
    30,
    0,
    0,
    0
  ).getTime();


function actualizarContador() {

  const ahora =
    new Date().getTime();

  const diferencia =
    fechaXV - ahora;


  if (diferencia <= 0) {

    document.getElementById("dias")
      .textContent = "0";

    document.getElementById("horas")
      .textContent = "0";

    document.getElementById("minutos")
      .textContent = "0";

    document.getElementById("segundos")
      .textContent = "0";

    return;
  }


  const dias =
    Math.floor(
      diferencia /
      (1000 * 60 * 60 * 24)
    );


  const horas =
    Math.floor(
      (
        diferencia %
        (1000 * 60 * 60 * 24)
      ) /
      (1000 * 60 * 60)
    );


  const minutos =
    Math.floor(
      (
        diferencia %
        (1000 * 60 * 60)
      ) /
      (1000 * 60)
    );


  const segundos =
    Math.floor(
      (
        diferencia %
        (1000 * 60)
      ) /
      1000
    );


  document.getElementById("dias")
    .textContent = dias;


  document.getElementById("horas")
    .textContent =
      String(horas).padStart(2, "0");


  document.getElementById("minutos")
    .textContent =
      String(minutos).padStart(2, "0");


  document.getElementById("segundos")
    .textContent =
      String(segundos).padStart(2, "0");

}


actualizarContador();

setInterval(
  actualizarContador,
  1000
);


/* =====================================================
   PÉTALOS
===================================================== */

let petalosIniciados = false;


function crearPetalo() {

  const contenedor =
    document.getElementById("petalos");


  if (!contenedor) {
    return;
  }


  const petalo =
    document.createElement("div");


  petalo.className =
    "petalo";


  /*
     Los pétalos caen dentro
     de la pequeña cúpula.
  */

  petalo.style.left =
    (25 + Math.random() * 50) + "%";


  petalo.style.top =
    (10 + Math.random() * 12) + "%";


  const tamaño =
    6 + Math.random() * 5;


  petalo.style.width =
    tamaño + "px";


  petalo.style.height =
    (tamaño * 1.35) + "px";


  petalo.style.animationDuration =
    (4 + Math.random() * 3) + "s";


  petalo.style.animationDelay =
    (Math.random() * 1) + "s";


  contenedor.appendChild(
    petalo
  );


  setTimeout(
    function() {

      petalo.remove();

    },
    8500
  );
}


function iniciarPetalos() {

  if (petalosIniciados) {
    return;
  }


  petalosIniciados = true;


  /*
     Algunos pétalos iniciales.
  */

  for (
    let i = 0;
    i < 3;
    i++
  ) {

    setTimeout(
      crearPetalo,
      i * 700
    );

  }


  /*
     Después caen lentamente.
  */

  setInterval(
    crearPetalo,
    2000
  );
}


/* =====================================================
   NIEVE
===================================================== */

const simbolosNieve = [
  "❄",
  "❅",
  "❆",
  "✦",
  "•"
];


function crearNieve() {

  const elemento =
    document.createElement("div");


  elemento.className =
    "nieve";


  elemento.textContent =
    simbolosNieve[
      Math.floor(
        Math.random() *
        simbolosNieve.length
      )
    ];


  elemento.style.left =
    Math.random() * 100 + "vw";


  elemento.style.fontSize =
    (8 + Math.random() * 15) + "px";


  elemento.style.animationDuration =
    (5 + Math.random() * 8) + "s";


  elemento.style.opacity =
    .3 + Math.random() * .7;


  document.body.appendChild(
    elemento
  );


  setTimeout(
    function() {

      elemento.remove();

    },
    14000
  );
}


setInterval(
  crearNieve,
  350
);

</script>

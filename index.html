<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050b1c;
  font-family:Georgia, "Times New Roman", serif;
  overflow-x:hidden;
  color:white;
}

.seccion{
  width:100%;
  position:relative;
}

.seccion img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}


/* =========================================================
   PORTADA
========================================================= */

#portada{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  cursor:pointer;
}

#portada img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay-portada{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:8%;
  background:linear-gradient(
    to bottom,
    transparent 60%,
    rgba(0,0,0,.65)
  );
}

.boton-abrir{
  padding:15px 35px;
  border:1px solid #d7b75b;
  border-radius:30px;
  color:#fff;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(5px);
  font-size:18px;
  letter-spacing:2px;
  box-shadow:0 0 15px rgba(215,183,91,.5);
  animation:pulsoBoton 2s infinite;
}

@keyframes pulsoBoton{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.04);
  }
}


/* =========================================================
   CONTENIDO
========================================================= */

#contenido{
  display:none;
}

#contenido.visible{
  display:block;
}


/* =========================================================
   BOTÓN DE MÚSICA
========================================================= */

.boton-musica{
  position:fixed;
  right:18px;
  bottom:18px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid #d7b75b;
  background:rgba(5,11,28,.85);
  color:#d7b75b;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 15px rgba(215,183,91,.5);
}


/* =========================================================
   CRONÓMETRO
========================================================= */

#cronometro{
  position:relative;
  overflow:hidden;
  width:100%;
}

.fondo-cronometro{
  display:block;
  width:100%;
  height:auto;
}

.contador{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  width:90%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:clamp(8px,2vw,25px);
  z-index:5;
}

.tiempo{
  text-align:center;
  min-width:60px;
}

.numero{
  display:block;
  color:#fff;
  font-size:clamp(25px,5vw,55px);
  font-weight:bold;
  line-height:1;
  text-shadow:
    0 0 5px #000,
    0 0 10px #000,
    0 2px 5px rgba(0,0,0,.8);
}

.etiqueta{
  display:block;
  margin-top:7px;
  color:#fff;
  font-size:clamp(8px,1.7vw,15px);
  letter-spacing:2px;
  text-shadow:0 0 5px #000;
}


/* =========================================================
   ROSA B&B
   ESTA ROSA VA DEBAJO DEL CRONÓMETRO
========================================================= */

.zona-rosa{
  position:absolute;
  left:0;
  right:0;

  /* IMPORTANTE:
     queda en la parte inferior de cronometro.jpeg */
  bottom:0;

  height:38%;
  min-height:250px;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  z-index:10;
  pointer-events:none;
}


/* Contenedor original de la rosa */

.container{
  position:relative;

  width:260px;
  height:300px;

  transform-origin:bottom center;

  animation:moverRosa 5s ease-in-out infinite;
}


/* =========================================================
   MOVIMIENTO SUAVE DE LA ROSA
========================================================= */

@keyframes moverRosa{

  0%,100%{
    transform:rotate(-1deg) translateY(0);
  }

  50%{
    transform:rotate(1deg) translateY(-4px);
  }

}


/* =========================================================
   GLASS / CÚPULA
========================================================= */

.glass{
  position:absolute;

  width:220px;
  height:255px;

  left:20px;
  top:5px;

  border-radius:
    110px 110px 20px 20px;

  border:2px solid rgba(255,255,255,.35);

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.08),
      rgba(255,255,255,.02) 35%,
      rgba(255,255,255,.08) 70%,
      rgba(255,255,255,.02)
    );

  box-shadow:
    inset 10px 0 20px rgba(255,255,255,.08),
    inset -10px 0 20px rgba(255,255,255,.04),
    0 0 15px rgba(255,255,255,.08);

  z-index:20;
}


/* Brillo del vidrio */

.shine{
  position:absolute;

  left:28px;
  top:25px;

  width:25px;
  height:150px;

  border-radius:50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.65),
      rgba(255,255,255,.05)
    );

  filter:blur(3px);

  transform:rotate(8deg);

  opacity:.45;
}


/* =========================================================
   TALLO
========================================================= */

.container:before{
  content:"";

  position:absolute;

  width:9px;
  height:180px;

  left:126px;
  top:105px;

  border-radius:50%;

  background:
    linear-gradient(
      to right,
      #0a3b20,
      #1d7c3d,
      #0a351c
    );

  transform:
    rotate(3deg);

  z-index:2;

  box-shadow:
    0 0 6px rgba(25,150,70,.5);
}


/* =========================================================
   ESPINAS
========================================================= */

.thorns{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  z-index:5;
}

.thorns div{
  position:absolute;

  width:0;
  height:0;

  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-right:13px solid #185b2e;
}

.thorns div:nth-child(1){
  left:103px;
  top:180px;
  transform:rotate(20deg);
}

.thorns div:nth-child(2){
  left:145px;
  top:210px;
  transform:rotate(200deg);
}

.thorns div:nth-child(3){
  left:102px;
  top:230px;
  transform:rotate(30deg);
}

.thorns div:nth-child(4){
  left:147px;
  top:155px;
  transform:rotate(190deg);
}


/* =========================================================
   HOJAS
========================================================= */

.leaves{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  z-index:4;
}

.leaves div{
  position:absolute;

  width:55px;
  height:25px;

  border-radius:
    100% 0 100% 0;

  background:
    linear-gradient(
      135deg,
      #2d9849,
      #075321
    );

  box-shadow:
    0 0 7px rgba(30,150,65,.35);
}


/* hoja izquierda */

.leaves div:nth-child(1){
  left:72px;
  top:190px;
  transform:rotate(-35deg);
}


/* hoja derecha */

.leaves div:nth-child(2){
  left:137px;
  top:180px;
  transform:rotate(35deg);
}


/* hoja izquierda inferior */

.leaves div:nth-child(3){
  left:78px;
  top:225px;
  transform:rotate(-20deg);
}


/* hoja derecha inferior */

.leaves div:nth-child(4){
  left:140px;
  top:225px;
  transform:rotate(25deg);
}


/* =========================================================
   CENTRO / PÉTALOS DE LA ROSA
========================================================= */

.petals{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  z-index:8;
}


/* pétalos */

.petals div{
  position:absolute;

  width:82px;
  height:62px;

  background:
    radial-gradient(
      ellipse at 50% 35%,
      #ff5065 0%,
      #e50935 38%,
      #9c001e 72%,
      #4b000d 100%
    );

  border-radius:
    70% 35% 65% 40%;

  box-shadow:
    inset 0 5px 8px rgba(255,110,130,.4),
    inset -6px -8px 10px rgba(70,0,10,.45),
    0 0 10px rgba(255,0,40,.25);
}


/* pétalo 1 */

.petals div:nth-child(1){
  left:89px;
  top:72px;

  transform:
    rotate(-10deg);

  z-index:5;
}


/* pétalo 2 */

.petals div:nth-child(2){
  left:116px;
  top:72px;

  transform:
    rotate(15deg)
    scale(.95);

  z-index:6;
}


/* pétalo 3 */

.petals div:nth-child(3){
  left:73px;
  top:92px;

  transform:
    rotate(-40deg)
    scale(.95);

  z-index:4;
}


/* pétalo 4 */

.petals div:nth-child(4){
  left:127px;
  top:92px;

  transform:
    rotate(40deg)
    scale(.95);

  z-index:4;
}


/* pétalo 5 */

.petals div:nth-child(5){
  left:90px;
  top:105px;

  transform:
    rotate(15deg)
    scale(.75);

  z-index:9;
}


/* pétalo 6 */

.petals div:nth-child(6){
  left:109px;
  top:104px;

  transform:
    rotate(-15deg)
    scale(.7);

  z-index:10;
}


/* pétalo central */

.petals div:nth-child(7){
  left:98px;
  top:92px;

  width:55px;
  height:48px;

  transform:
    rotate(5deg)
    scale(.65);

  z-index:11;

  background:
    radial-gradient(
      ellipse at 40% 35%,
      #ff7080,
      #d9002d 55%,
      #65000f
    );
}


/* =========================================================
   PÉTALOS CAÍDOS
========================================================= */

.deadPetals{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  z-index:15;
}

.deadPetals div{
  position:absolute;

  width:16px;
  height:22px;

  border-radius:
    70% 30% 70% 30%;

  background:
    linear-gradient(
      135deg,
      #ff5068,
      #dc0b32 55%,
      #800016
    );

  box-shadow:
    0 0 5px rgba(255,30,65,.5);

  opacity:0;
}


/* pétalo caído 1 */

.deadPetals div:nth-child(1){
  left:80px;
  top:115px;

  animation:
    caerPetalo1 5s linear infinite;
}


/* pétalo caído 2 */

.deadPetals div:nth-child(2){
  left:155px;
  top:120px;

  animation:
    caerPetalo2 6s linear infinite;

  animation-delay:1.5s;
}


/* pétalo caído 3 */

.deadPetals div:nth-child(3){
  left:105px;
  top:130px;

  animation:
    caerPetalo3 5.5s linear infinite;

  animation-delay:2.5s;
}


/* pétalo caído 4 */

.deadPetals div:nth-child(4){
  left:135px;
  top:105px;

  animation:
    caerPetalo4 6.5s linear infinite;

  animation-delay:3s;
}


/* =========================================================
   ANIMACIONES DE PÉTALOS
========================================================= */

@keyframes caerPetalo1{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0deg);
  }

  10%{
    opacity:.9;
  }

  45%{
    transform:
      translate(-25px,70px)
      rotate(160deg);
  }

  75%{
    transform:
      translate(20px,145px)
      rotate(280deg);
  }

  100%{
    opacity:0;
    transform:
      translate(-10px,210px)
      rotate(390deg);
  }

}


@keyframes caerPetalo2{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0deg);
  }

  12%{
    opacity:.9;
  }

  40%{
    transform:
      translate(20px,60px)
      rotate(120deg);
  }

  70%{
    transform:
      translate(-15px,135px)
      rotate(250deg);
  }

  100%{
    opacity:0;
    transform:
      translate(10px,205px)
      rotate(360deg);
  }

}


@keyframes caerPetalo3{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0deg);
  }

  10%{
    opacity:.9;
  }

  50%{
    transform:
      translate(30px,85px)
      rotate(180deg);
  }

  100%{
    opacity:0;
    transform:
      translate(-20px,210px)
      rotate(390deg);
  }

}


@keyframes caerPetalo4{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0deg);
  }

  10%{
    opacity:.9;
  }

  45%{
    transform:
      translate(-20px,80px)
      rotate(150deg);
  }

  75%{
    transform:
      translate(15px,145px)
      rotate(290deg);
  }

  100%{
    opacity:0;
    transform:
      translate(-5px,220px)
      rotate(420deg);
  }

}


/* =========================================================
   CONFIRMAR ASISTENCIA
========================================================= */

#confirmar{
  position:relative;
}

.boton-whatsapp{
  position:absolute;

  left:50%;
  bottom:8%;

  transform:translateX(-50%);

  padding:14px 28px;

  border-radius:30px;

  background:#0d8f48;

  color:white;

  text-decoration:none;

  font-family:Arial,sans-serif;

  font-size:16px;

  font-weight:bold;

  box-shadow:
    0 4px 15px rgba(0,0,0,.4);

  white-space:nowrap;

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

  .contador{
    top:43%;
    gap:5px;
  }

  .tiempo{
    min-width:50px;
  }

  .numero{
    font-size:clamp(20px,7vw,34px);
  }

  .etiqueta{
    font-size:8px;
    letter-spacing:1px;
  }

  /*
    Rosa más pequeña en celular
    y siempre ABAJO
  */

  .zona-rosa{
    height:35%;
    min-height:210px;
  }

  .container{
    transform-origin:bottom center;
    width:220px;
    height:260px;
    transform:scale(.82);
    animation:moverRosaMobile 5s ease-in-out infinite;
  }

  @keyframes moverRosaMobile{

    0%,100%{
      transform:
        scale(.82)
        rotate(-1deg)
        translateY(0);
    }

    50%{
      transform:
        scale(.82)
        rotate(1deg)
        translateY(-3px);
    }

  }

  .glass{
    width:190px;
    height:225px;
    left:15px;
  }

  .boton-whatsapp{
    font-size:14px;
    padding:12px 20px;
  }

}


/* =========================================================
   CRÉDITOS
========================================================= */

.creditos{
  background:#050b1c;
  text-align:center;
  padding:30px 15px 40px;
  color:#ddd;
  font-family:Arial,sans-serif;
}

.creditos .hecho{

}

.creditos .marca{

}

.creditos a{
  color:#fff;
  text-decoration:none;
  display:block;
  margin:5px 0;
  font-size:14px;
}

.creditos a:hover{
  color:#d7b75b;
}

</style>
</head>

<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const portada =
  document.getElementById("portada");

const contenido =
  document.getElementById("contenido");

const musica =
  document.getElementById("musica");

const botonMusica =
  document.getElementById("botonMusica");


/* =========================================================
   ABRIR INVITACIÓN
========================================================= */

function abrirInvitacion(){

  contenido.classList.add("visible");

  musica.currentTime = 0;

  musica.volume = 1;

  musica.play().catch(function(error){
    console.log("El navegador bloqueó el audio:",error);
  });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   PORTADA CLICKEABLE
========================================================= */

portada.addEventListener(
  "click",
  abrirInvitacion
);


/* =========================================================
   MÚSICA
========================================================= */

function toggleMusica(){

  if(musica.paused){

    musica.play();

    botonMusica.innerHTML="♪";

  }else{

    musica.pause();

    botonMusica.innerHTML="🔇";

  }

}


/* =========================================================
   CRONÓMETRO
========================================================= */

const fechaXV =
  new Date(
    2026,
    11,
    30,
    0,
    0,
    0
  ).getTime();


function actualizarCronometro(){

  const ahora =
    new Date().getTime();

  let diferencia =
    fechaXV - ahora;


  if(diferencia < 0){
    diferencia = 0;
  }


  const dias =
    Math.floor(
      diferencia /
      (1000 * 60 * 60 * 24)
    );


  const horas =
    Math.floor(
      (diferencia %
      (1000 * 60 * 60 * 24)) /
      (1000 * 60 * 60)
    );


  const minutos =
    Math.floor(
      (diferencia %
      (1000 * 60 * 60)) /
      (1000 * 60)
    );


  const segundos =
    Math.floor(
      (diferencia %
      (1000 * 60)) /
      1000
    );


  document.getElementById("dias")
    .textContent = dias;

  document.getElementById("horas")
    .textContent =
    String(horas).padStart(2,"0");

  document.getElementById("minutos")
    .textContent =
    String(minutos).padStart(2,"0");

  document.getElementById("segundos")
    .textContent =
    String(segundos).padStart(2,"0");

}


actualizarCronometro();

setInterval(
  actualizarCronometro,
  1000
);

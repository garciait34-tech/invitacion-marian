<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  background:#050b16;
  font-family:Georgia, "Times New Roman", serif;
  overflow-x:hidden;
  color:white;
}

/* =========================================================
   PORTADA
========================================================= */

#portada{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  z-index:9999;
  background:#000;
  cursor:pointer;
  transition:
    opacity 1.2s ease,
    transform 1.5s ease,
    visibility 1.5s ease;
}

#portada img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

#portada.abierta{
  opacity:0;
  visibility:hidden;
  transform:scale(1.08);
  pointer-events:none;
}

/* =========================================================
   CONTENIDO
========================================================= */

#contenido{
  opacity:0;
  visibility:hidden;
  transition:opacity 1.5s ease;
}

#contenido.visible{
  opacity:1;
  visibility:visible;
}

/* =========================================================
   SECCIONES
========================================================= */

.seccion{
  width:100%;
  position:relative;
  overflow:hidden;
}

.seccion img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}

/* =========================================================
   BOTÓN DE MÚSICA
========================================================= */

#botonMusica{
  position:fixed;
  right:18px;
  bottom:18px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.7);
  background:rgba(5,15,35,.75);
  color:white;
  z-index:9000;
  cursor:pointer;
  font-size:20px;
  backdrop-filter:blur(5px);
  box-shadow:0 0 15px rgba(255,255,255,.25);
}

/* =========================================================
   CRONÓMETRO
========================================================= */

.cronometro{
  position:relative;
  width:100%;
}

.cronometro > img{
  display:block;
  width:100%;
  height:auto;
}

/* =========================================================
   NÚMEROS DEL CRONÓMETRO
========================================================= */

#contador{
  position:absolute;

  left:50%;
  top:59%;

  transform:translate(-50%,-50%);

  width:90%;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:clamp(8px,2.5vw,35px);

  z-index:40;
}

.numero{
  text-align:center;
  min-width:55px;
}

.numero .valor{
  display:block;

  font-family:Georgia, "Times New Roman", serif;

  font-size:clamp(24px,5vw,58px);

  line-height:1;

  color:#ffffff;

  text-shadow:
    0 2px 4px rgba(0,0,0,.8),
    0 0 10px rgba(255,255,255,.35);
}

.numero .texto{
  display:block;

  margin-top:7px;

  font-size:clamp(8px,1.5vw,15px);

  letter-spacing:2px;

  color:#ffffff;

  text-shadow:
    0 2px 4px rgba(0,0,0,.8);
}

/* =========================================================
   ZONA DE LA ROSA
========================================================= */

.rosa-zona{
  position:absolute;

  left:50%;
  bottom:3%;

  transform:translateX(-50%);

  width:280px;
  height:380px;

  z-index:20;

  overflow:visible;

  pointer-events:none;
}

/* =========================================================
   ROSA
========================================================= */

.rosa-container{

  position:relative;

  width:250px;
  height:370px;

  transform:scale(.70);

  transform-origin:bottom center;

  animation:rosaSuave 5s ease-in-out infinite;

  margin:auto;
}

/* Movimiento suave de la rosa */

@keyframes rosaSuave{

  0%,100%{
    margin-left:0;
  }

  50%{
    margin-left:3px;
  }

}

/* =========================================================
   COPOS
========================================================= */

.rosa-container .copos{

  position:absolute;

  inset:0;

  z-index:60;

  pointer-events:none;

  overflow:hidden;
}

.rosa-container .copos span{

  position:absolute;

  top:-20px;

  color:white;

  font-size:13px;

  line-height:1;

  text-shadow:
    0 0 5px white,
    0 0 10px rgba(180,220,255,.9),
    0 0 15px rgba(255,255,255,.5);

  opacity:0;

  animation:
    caerCopo 5s linear infinite;
}

/* Copo 1 */

.rosa-container .copos span:nth-child(1){

  left:20%;

  animation-delay:0s;

  animation-duration:4.5s;
}

/* Copo 2 */

.rosa-container .copos span:nth-child(2){

  left:38%;

  animation-delay:1s;

  animation-duration:5.5s;

  font-size:10px;
}

/* Copo 3 */

.rosa-container .copos span:nth-child(3){

  left:55%;

  animation-delay:2s;

  animation-duration:4s;

  font-size:14px;
}

/* Copo 4 */

.rosa-container .copos span:nth-child(4){

  left:70%;

  animation-delay:.5s;

  animation-duration:5s;

  font-size:9px;
}

/* Copo 5 */

.rosa-container .copos span:nth-child(5){

  left:30%;

  animation-delay:2.5s;

  animation-duration:4.8s;

  font-size:12px;
}

/* Copo 6 */

.rosa-container .copos span:nth-child(6){

  left:62%;

  animation-delay:3s;

  animation-duration:5.2s;

  font-size:11px;
}

/* =========================================================
   ANIMACIÓN DE LOS COPOS
========================================================= */

@keyframes caerCopo{

  0%{

    transform:
      translateY(-20px)
      translateX(0)
      rotate(0deg);

    opacity:0;
  }

  10%{

    opacity:.9;
  }

  35%{

    transform:
      translateY(110px)
      translateX(12px)
      rotate(90deg);

    opacity:.9;
  }

  60%{

    transform:
      translateY(210px)
      translateX(-10px)
      rotate(180deg);

    opacity:.8;
  }

  85%{

    transform:
      translateY(290px)
      translateX(10px)
      rotate(270deg);

    opacity:.6;
  }

  100%{

    transform:
      translateY(360px)
      translateX(-5px)
      rotate(360deg);

    opacity:0;
  }

}

/* =========================================================
   ROSA B&B
========================================================= */

.rosa-container .glass{

  height:350px;

  width:200px;

  background:#122139;

  border-radius:300px 300px 0 0;

  position:absolute;

  left:25px;

  top:0;

  z-index:10;
}

.rosa-container .glass:before{

  content:"";

  height:10px;

  width:10px;

  transform-origin:center;

  border:10px solid #122139;

  border-radius:100%;

  position:absolute;

  left:87px;

  top:-25px;
}

.rosa-container .glass:after{

  content:"";

  position:absolute;

  height:15px;

  width:250px;

  background:#a52a2a;

  top:100%;

  left:-13%;
}

.rosa-container .shine{

  width:12px;

  height:140px;

  background:white;

  opacity:.2;

  position:absolute;

  left:85%;

  top:80px;

  border-radius:100px;

  z-index:10;
}

.rosa-container .shine:before{

  content:"";

  width:12px;

  height:20px;

  position:absolute;

  background:white;

  top:160px;

  border-radius:100px;
}

/* =========================================================
   PÉTALOS DE LA ROSA
========================================================= */

.rosa-container .petals > div{

  position:absolute;

  background:#d52d58;

  width:45px;

  height:80px;

  top:55px;

  transition:all .5s ease-out;
}

.rosa-container .petals > div:nth-child(1){

  border-radius:15px;

  box-shadow:0 0 30px #f594b8;

  left:80px;

  top:60px;

  background:#d52d58;
}

.rosa-container .petals > div:nth-child(2),
.rosa-container .petals > div:nth-child(4),
.rosa-container .petals > div:nth-child(6){

  background:#b81b43;

  left:60px;

  border-radius:0 30px 0 30px;

  transform-origin:bottom right;
}

.rosa-container .petals > div:nth-child(3),
.rosa-container .petals > div:nth-child(5),
.rosa-container .petals > div:nth-child(7){

  background:#b81b43;

  left:100px;

  border-radius:30px 0 30px 0;

  transform-origin:bottom left;
}

/* Pétalo 2 */

.rosa-container .petals > div:nth-child(2){

  z-index:5;

  background:#ab1a3f;

  top:75px;

  height:70px;

  box-shadow:
    0 0 50px rgba(245,148,184,.5);

  animation:bloom2 3s ease-in-out;

  animation-fill-mode:forwards;
}

/* Pétalo 3 */

.rosa-container .petals > div:nth-child(3){

  z-index:4;

  background:#ab1a3f;

  top:75px;

  height:70px;

  box-shadow:
    0 0 50px rgba(245,148,184,.5);

  animation:
    bloom3 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

/* Pétalo 4 */

.rosa-container .petals > div:nth-child(4){

  z-index:3;

  background:#b81b43;

  top:70px;

  height:75px;

  box-shadow:
    0 0 50px rgba(245,148,184,.5);

  animation:
    bloom4 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

/* Pétalo 5 */

.rosa-container .petals > div:nth-child(5){

  z-index:2;

  background:#b81b43;

  top:70px;

  height:75px;

  box-shadow:
    0 0 50px rgba(245,148,184,.5);

  animation:
    bloom5 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

/* Pétalo 6 */

.rosa-container .petals > div:nth-child(6){

  z-index:1;

  background:#c9204b;

  top:65px;

  height:70px;

  box-shadow:
    0 0 50px rgba(245,148,184,.3);

  animation:
    bloom6 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

/* Pétalo 7 */

.rosa-container .petals > div:nth-child(7){

  z-index:0;

  background:#c9204b;

  top:65px;

  height:70px;

  box-shadow:
    0 0 50px rgba(245,148,184,.3);

  animation:
    bloom7 3s ease-in-out,
    glowing 2.5s ease-in-out infinite;

  animation-fill-mode:forwards;
}

/* =========================================================
   PÉTALOS QUE CAEN
========================================================= */

.rosa-container .deadPetals > div{

  position:absolute;

  background:#d52d58;

  width:20px;

  height:15px;

  top:120px;

  border-radius:0 30px 0 30px;

  box-shadow:
    0 0 30px rgba(245,148,184,.5);

  transition:all .5s ease-out;
}

.rosa-container .deadPetals > div:nth-child(1){

  left:67px;

  transform:rotate(-30deg);

  animation:
    falling 20s 4s ease-in-out infinite;
}

.rosa-container .deadPetals > div:nth-child(2){

  left:104px;

  transform:rotate(-30deg);

  animation:
    falling 20s 8s ease-in-out infinite;
}

.rosa-container .deadPetals > div:nth-child(3){

  left:91px;

  transform:rotate(-30deg);

  animation:
    falling 20s 12s ease-in-out infinite;
}

.rosa-container .deadPetals > div:nth-child(4){

  left:69px;

  transform:rotate(-30deg);

  animation:
    falling 20s 16s ease-in-out infinite;
}

/* =========================================================
   HOJAS
========================================================= */

.rosa-container .leaves > div:nth-last-child(1){

  position:absolute;

  width:55px;

  height:30px;

  background:#338f37;

  top:120px;

  left:75px;

  border-radius:100px;
}

.rosa-container .leaves > div:nth-child(1){

  position:absolute;

  width:6px;

  height:210px;

  background:#054c05;

  top:95px;

  left:100px;

  border-radius:0 0 100px 100px;
}

.rosa-container .leaves > div:nth-child(2){

  position:absolute;

  width:30px;

  height:50px;

  border-radius:5px 40px 20px 40px;

  background:#054c05;

  transform-origin:bottom;

  transform:rotate(-30deg);

  top:180px;

  left:80px;

  box-shadow:inset 5px 5px #066406;
}

.rosa-container .leaves > div:nth-child(3){

  position:absolute;

  width:30px;

  height:50px;

  border-radius:40px 5px 40px 20px;

  background:#054c05;

  transform-origin:bottom;

  transform:rotate(30deg);

  top:150px;

  left:95px;

  box-shadow:inset -5px 5px #066406;
}

/* =========================================================
   ESPINAS
========================================================= */

.rosa-container .thorns > div{

  position:absolute;

  width:0;

  height:0;

  top:140px;
}

.rosa-container .thorns > div:nth-child(odd){

  border-top:5px solid transparent;

  border-bottom:5px solid transparent;

  border-left:5px solid #054c05;

  left:105px;
}

.rosa-container .thorns > div:nth-child(even){

  border-top:5px solid transparent;

  border-bottom:5px solid transparent;

  border-right:5px solid #054c05;

  left:95px;
}

.rosa-container .thorns > div:nth-child(1){

  top:200px;
}

.rosa-container .thorns > div:nth-child(2){

  top:170px;
}

.rosa-container .thorns > div:nth-child(4){

  top:230px;
}

/* =========================================================
   ANIMACIONES DE LA ROSA
========================================================= */

@keyframes bloom2{

  50%{

    transform:rotate(-90deg);

    top:200px;

    left:100px;
  }

  100%{

    transform:rotate(-60deg);

    top:252px;

    left:50px;

    background:#71122a;

    box-shadow:
      0 0 0 rgba(245,148,184,0);
  }
}

@keyframes bloom3{

  100%{
    transform:rotate(45deg);
  }
}

@keyframes bloom4{

  100%{
    transform:rotate(-20deg);
  }
}

@keyframes bloom5{

  100%{
    transform:rotate(20deg);
  }
}

@keyframes bloom6{

  100%{
    transform:rotate(-5deg);
  }
}

@keyframes bloom7{

  100%{
    transform:rotate(5deg);
  }
}

@keyframes glowing{

  50%{

    background:#d7365f;

    box-shadow:
      0 0 60px #f594b8;
  }
}

@keyframes falling{

  20%{

    top:335px;

    background:#9d193b;

    box-shadow:
      0 0 0 rgba(245,148,184,0);
  }

  100%{

    top:335px;

    opacity:0;
  }
}

/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp-btn{

  position:absolute;

  left:50%;

  bottom:12%;

  transform:translateX(-50%);

  display:inline-block;

  padding:13px 25px;

  border-radius:30px;

  text-decoration:none;

  color:white;

  background:#0b5d39;

  border:1px solid rgba(255,255,255,.7);

  font-family:Arial,sans-serif;

  font-size:15px;

  letter-spacing:.5px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.35);
}

.whatsapp-btn:hover{

  background:#087b4b;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

  #contador{

    gap:5px;

    width:96%;
  }

  .numero{

    min-width:48px;
  }

  .numero .valor{

    font-size:25px;
  }

  .numero .texto{

    font-size:7px;

    letter-spacing:1px;
  }

  .rosa-zona{

    width:230px;

    height:330px;

    bottom:2%;
  }

  .rosa-container{

    transform:scale(.54);

    transform-origin:bottom center;
  }

  .whatsapp-btn{

    font-size:13px;

    padding:11px 20px;
  }

}

/* =========================================================
   CELULARES MUY PEQUEÑOS
========================================================= */

@media(max-width:380px){

  .numero .valor{

    font-size:21px;
  }

  .numero .texto{

    font-size:6px;
  }

  .rosa-container{

    transform:scale(.48);
  }

}

/* =========================================================
   REDUCIR ANIMACIONES SI EL USUARIO LO PIDE
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:0.01ms !important;

    animation-iteration-count:1 !important;

    scroll-behavior:auto !important;
  }

}

</style>
</head>

<body>

<!-- =====================================================
     PORTADA
===================================================== -->

<div id="portada" onclick="abrirInvitacion()">

<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const portada =
  document.getElementById("portada");

const contenido =
  document.getElementById("contenido");

const musica =
  document.getElementById("musica");

const botonMusica =
  document.getElementById("botonMusica");


/* =========================================================
   ABRIR INVITACIÓN
========================================================= */

function abrirInvitacion(){

  portada.classList.add("abierta");

  contenido.classList.add("visible");

  /* La música siempre comienza desde 0:00 */

  musica.currentTime = 0;

  musica.volume = 1;

  musica.play()
    .then(()=>{

      botonMusica.textContent = "🔊";

    })
    .catch(()=>{

      console.log(
        "El navegador bloqueó temporalmente la reproducción."
      );

    });

}


/* =========================================================
   BOTÓN DE MÚSICA
========================================================= */

function alternarMusica(){

  if(musica.paused){

    musica.play();

    botonMusica.textContent = "🔊";

  }else{

    musica.pause();

    botonMusica.textContent = "🔇";

  }

}


/* =========================================================
   CRONÓMETRO
========================================================= */

/*
   30 de diciembre de 2026
   00:00:00
*/

const fechaXV =
  new Date(
    2026,
    11,
    30,
    0,
    0,
    0
  ).getTime();


function actualizarContador(){

  const ahora =
    new Date().getTime();

  let diferencia =
    fechaXV - ahora;


  /* Si ya llegó la fecha */

  if(diferencia < 0){

    diferencia = 0;

  }


  const dias =
    Math.floor(
      diferencia /
      (1000 * 60 * 60 * 24)
    );


  const horas =
    Math.floor(
      (diferencia %
        (1000 * 60 * 60 * 24))
      /
      (1000 * 60 * 60)
    );


  const minutos =
    Math.floor(
      (diferencia %
        (1000 * 60 * 60))
      /
      (1000 * 60)
    );


  const segundos =
    Math.floor(
      (diferencia %
        (1000 * 60))
      /
      1000
    );


  document.getElementById("dias")
    .textContent =
    String(dias).padStart(3,"0");


  document.getElementById("horas")
    .textContent =
    String(horas).padStart(2,"0");


  document.getElementById("minutos")
    .textContent =
    String(minutos).padStart(2,"0");


  document.getElementById("segundos")
    .textContent =
    String(segundos).padStart(2,"0");

}


/* =========================================================
   INICIAR CONTADOR
========================================================= */

actualizarContador();

setInterval(
  actualizarContador,
  1000
);

</script>

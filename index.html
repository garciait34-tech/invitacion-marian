<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  background:#061329;
  overflow-x:hidden;
  font-family:Georgia,"Times New Roman",serif;
}

.seccion{
  width:100%;
  position:relative;
}

.seccion img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}


/* =========================================================
   PORTADA
========================================================= */

#portada{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
  cursor:pointer;
}

#portada img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay-portada{
  position:absolute;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  padding-bottom:8%;

  background:
    linear-gradient(
      to bottom,
      transparent 60%,
      rgba(0,0,0,.65)
    );
}

.boton-abrir{
  padding:14px 32px;

  border:1px solid #d8b75b;
  border-radius:30px;

  color:white;

  background:rgba(0,0,0,.3);

  backdrop-filter:blur(5px);

  font-size:17px;
  letter-spacing:2px;

  box-shadow:
    0 0 15px rgba(216,183,91,.45);

  animation:pulso 2.2s ease-in-out infinite;
}

@keyframes pulso{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}


/* =========================================================
   CONTENIDO
========================================================= */

#contenido{
  display:none;
}

#contenido.visible{
  display:block;
}


/* =========================================================
   MÚSICA
========================================================= */

.boton-musica{
  position:fixed;

  right:18px;
  bottom:18px;

  width:55px;
  height:55px;

  border-radius:50%;

  border:1px solid #d8b75b;

  background:
    rgba(5,14,32,.92);

  color:#d8b75b;

  z-index:9999;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:22px;

  cursor:pointer;

  box-shadow:
    0 0 15px rgba(216,183,91,.35);
}


/* =========================================================
   CRONÓMETRO
========================================================= */

#cronometro{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#061a31;
}

.fondo-cronometro{
  width:100%;
  height:auto;
  display:block;
}


/* =========================================================
   CONTADOR
========================================================= */

/*
   MUY IMPORTANTE:

   El contador ya NO queda en medio de la frase.

   Lo colocamos debajo de la frase y antes
   de la rosa.
*/

.contador{
  position:absolute;

  left:50%;

  top:59%;

  transform:translateX(-50%);

  width:88%;

  display:flex;

  justify-content:center;
  align-items:center;

  gap:clamp(7px,2.5vw,25px);

  z-index:30;
}

.tiempo{
  text-align:center;

  min-width:55px;
}

.numero{
  display:block;

  color:white;

  font-family:Georgia,"Times New Roman",serif;

  font-size:
    clamp(25px,6vw,52px);

  font-weight:bold;

  line-height:1;

  text-shadow:
    0 2px 4px rgba(0,0,0,.9),
    0 0 8px rgba(0,0,0,.8);
}

.etiqueta{
  display:block;

  margin-top:7px;

  color:white;

  font-family:Georgia,"Times New Roman",serif;

  font-size:
    clamp(7px,1.7vw,14px);

  letter-spacing:
    clamp(1px,1vw,3px);

  text-shadow:
    0 2px 4px rgba(0,0,0,.9);
}


/* =========================================================
   ZONA DE LA ROSA
========================================================= */

.zona-rosa{

  position:absolute;

  left:0;
  right:0;

  /*
     La rosa queda en la parte inferior
     del cronómetro.
  */

  top:70%;

  height:29%;

  display:flex;

  justify-content:center;

  align-items:flex-start;

  z-index:20;

  pointer-events:none;
}


/* =========================================================
   ROSA
========================================================= */

.rosa-container{

  position:relative;

  width:210px;
  height:270px;

  transform-origin:
    50% 100%;

  animation:
    balanceoRosa
    5s
    ease-in-out
    infinite;
}


/* movimiento muy suave */

@keyframes balanceoRosa{

  0%,100%{
    transform:
      rotate(-1deg)
      translateY(0);
  }

  50%{
    transform:
      rotate(1deg)
      translateY(-3px);
  }

}


/* =========================================================
   CÚPULA DE CRISTAL
========================================================= */

.glass{

  position:absolute;

  left:15px;
  top:0;

  width:180px;
  height:225px;

  border-radius:
    90px 90px 25px 25px;

  border:
    2px solid
    rgba(220,235,255,.40);

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.11),
      rgba(255,255,255,.025),
      rgba(255,255,255,.08),
      rgba(255,255,255,.025)
    );

  box-shadow:

    inset
    8px 0 15px
    rgba(255,255,255,.08),

    inset
    -8px 0 15px
    rgba(255,255,255,.04),

    0 0 12px
    rgba(180,210,255,.10);

  z-index:20;
}


/* brillo del cristal */

.shine{

  position:absolute;

  left:22px;
  top:25px;

  width:16px;
  height:135px;

  border-radius:50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.65),
      rgba(255,255,255,.02)
    );

  filter:blur(3px);

  opacity:.35;

  transform:rotate(8deg);
}


/* =========================================================
   BASE DE LA CÚPULA
========================================================= */

.rosa-container::after{

  content:"";

  position:absolute;

  left:10px;
  bottom:25px;

  width:190px;
  height:10px;

  border-radius:50%;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(210,220,235,.35),
      rgba(255,255,255,.45),
      rgba(210,220,235,.35),
      transparent
    );

  filter:blur(.5px);

  z-index:25;
}


/* =========================================================
   TALLO
========================================================= */

.rosa-container::before{

  content:"";

  position:absolute;

  left:103px;
  top:105px;

  width:7px;
  height:145px;

  border-radius:100%;

  background:
    linear-gradient(
      to right,
      #06451f,
      #1b8b3c,
      #0a4e24
    );

  box-shadow:
    0 0 5px
    rgba(50,180,80,.4);

  transform:
    rotate(2deg);

  z-index:4;
}


/* =========================================================
   HOJAS
========================================================= */

.leaves{

  position:absolute;

  inset:0;

  z-index:5;
}

.leaves div{

  position:absolute;

  width:48px;
  height:22px;

  background:
    linear-gradient(
      135deg,
      #299746,
      #07551f
    );

  border-radius:
    100% 0 100% 0;

  box-shadow:
    0 0 5px
    rgba(20,130,55,.35);
}


/* izquierda */

.leaves div:nth-child(1){

  left:56px;
  top:175px;

  transform:
    rotate(-35deg);
}


/* derecha */

.leaves div:nth-child(2){

  left:110px;
  top:165px;

  transform:
    rotate(35deg);
}


/* izquierda abajo */

.leaves div:nth-child(3){

  left:60px;
  top:205px;

  transform:
    rotate(-18deg);
}


/* derecha abajo */

.leaves div:nth-child(4){

  left:112px;
  top:208px;

  transform:
    rotate(20deg);
}


/* =========================================================
   ESPINAS
========================================================= */

.thorns{

  position:absolute;

  inset:0;

  z-index:6;
}

.thorns div{

  position:absolute;

  width:0;
  height:0;

  border-top:
    5px solid transparent;

  border-bottom:
    5px solid transparent;

  border-right:
    11px solid #14632c;
}

.thorns div:nth-child(1){

  left:84px;
  top:165px;

  transform:rotate(20deg);
}

.thorns div:nth-child(2){

  left:120px;
  top:188px;

  transform:rotate(190deg);
}

.thorns div:nth-child(3){

  left:83px;
  top:212px;

  transform:rotate(25deg);
}

.thorns div:nth-child(4){

  left:119px;
  top:145px;

  transform:rotate(190deg);
}


/* =========================================================
   PÉTALOS DE LA ROSA
========================================================= */

.petals{

  position:absolute;

  left:50%;
  top:48px;

  width:125px;
  height:105px;

  transform:translateX(-50%);

  z-index:10;
}


/*
   Ahora sí:

   pétalos definidos y curvos,
   no bolitas.
*/

.petals div{

  position:absolute;

  background:
    radial-gradient(
      ellipse at 40% 30%,
      #ff6a78 0%,
      #f21c43 32%,
      #bd0829 65%,
      #650014 100%
    );

  box-shadow:

    inset
    3px 3px 7px
    rgba(255,150,160,.35),

    inset
    -4px -5px 8px
    rgba(70,0,15,.4),

    0 0 8px
    rgba(255,20,55,.18);

}


/* pétalo exterior izquierdo */

.petals div:nth-child(1){

  width:65px;
  height:65px;

  left:0;
  top:25px;

  border-radius:
    70% 35% 65% 45%;

  transform:
    rotate(-30deg);
}


/* pétalo exterior derecho */

.petals div:nth-child(2){

  width:68px;
  height:68px;

  right:0;
  top:23px;

  border-radius:
    35% 70% 45% 65%;

  transform:
    rotate(30deg);
}


/* pétalo superior izquierdo */

.petals div:nth-child(3){

  width:63px;
  height:62px;

  left:22px;
  top:5px;

  border-radius:
    65% 35% 55% 45%;

  transform:
    rotate(-12deg);
}


/* pétalo superior derecho */

.petals div:nth-child(4){

  width:63px;
  height:62px;

  right:21px;
  top:4px;

  border-radius:
    35% 65% 45% 55%;

  transform:
    rotate(12deg);
}


/* pétalo central izquierdo */

.petals div:nth-child(5){

  width:52px;
  height:53px;

  left:28px;
  top:38px;

  border-radius:
    70% 35% 60% 40%;

  transform:
    rotate(-20deg);

  z-index:5;
}


/* pétalo central derecho */

.petals div:nth-child(6){

  width:52px;
  height:53px;

  right:28px;
  top:37px;

  border-radius:
    35% 70% 40% 60%;

  transform:
    rotate(20deg);

  z-index:5;
}


/* centro */

.petals div:nth-child(7){

  width:45px;
  height:48px;

  left:40px;
  top:33px;

  border-radius:
    50% 50% 45% 55%;

  transform:
    rotate(8deg);

  background:
    radial-gradient(
      ellipse at 35% 25%,
      #ff8994,
      #ed153d 35%,
      #a50022 70%,
      #4d000e
    );

  z-index:15;
}


/* =========================================================
   PÉTALOS QUE CAEN
========================================================= */

.deadPetals{

  position:absolute;

  inset:0;

  z-index:30;
}


/* forma */

.deadPetals div{

  position:absolute;

  width:9px;
  height:13px;

  border-radius:
    70% 30% 70% 30%;

  background:
    linear-gradient(
      135deg,
      #ff6275,
      #dc0b32 60%,
      #850016
    );

  box-shadow:
    0 0 4px
    rgba(255,40,70,.45);

  opacity:0;
}


/* pétalo 1 */

.deadPetals div:nth-child(1){

  left:82px;
  top:95px;

  animation:
    petalo1
    5.5s
    ease-in
    infinite;
}


/* pétalo 2 */

.deadPetals div:nth-child(2){

  left:122px;
  top:105px;

  animation:
    petalo2
    6s
    ease-in
    infinite;

  animation-delay:1.7s;
}


/* pétalo 3 */

.deadPetals div:nth-child(3){

  left:94px;
  top:112px;

  animation:
    petalo3
    5.8s
    ease-in
    infinite;

  animation-delay:3s;
}


/* pétalo 4 */

.deadPetals div:nth-child(4){

  left:135px;
  top:92px;

  animation:
    petalo4
    6.2s
    ease-in
    infinite;

  animation-delay:4s;
}


/* =========================================================
   ANIMACIONES DE PÉTALOS
========================================================= */

@keyframes petalo1{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0);
  }

  10%{
    opacity:.9;
  }

  40%{
    transform:
      translate(-15px,45px)
      rotate(100deg);
  }

  70%{
    transform:
      translate(8px,90px)
      rotate(210deg);
  }

  100%{
    opacity:0;
    transform:
      translate(-10px,135px)
      rotate(320deg);
  }
}


@keyframes petalo2{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0);
  }

  10%{
    opacity:.9;
  }

  45%{
    transform:
      translate(16px,45px)
      rotate(110deg);
  }

  75%{
    transform:
      translate(-8px,95px)
      rotate(230deg);
  }

  100%{
    opacity:0;
    transform:
      translate(10px,140px)
      rotate(350deg);
  }
}


@keyframes petalo3{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0);
  }

  10%{
    opacity:.85;
  }

  50%{
    transform:
      translate(18px,55px)
      rotate(160deg);
  }

  100%{
    opacity:0;
    transform:
      translate(-10px,140px)
      rotate(330deg);
  }
}


@keyframes petalo4{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(0);
  }

  10%{
    opacity:.85;
  }

  45%{
    transform:
      translate(-16px,50px)
      rotate(140deg);
  }

  75%{
    transform:
      translate(8px,100px)
      rotate(260deg);
  }

  100%{
    opacity:0;
    transform:
      translate(-4px,145px)
      rotate(370deg);
  }
}


/* =========================================================
   CONFIRMAR
========================================================= */

#confirmar{
  position:relative;
}

.boton-whatsapp{

  position:absolute;

  left:50%;
  bottom:8%;

  transform:translateX(-50%);

  padding:14px 28px;

  border-radius:30px;

  background:#0b8f48;

  color:white;

  text-decoration:none;

  font-family:Arial,sans-serif;

  font-size:15px;

  font-weight:bold;

  white-space:nowrap;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.4);
}


/* =========================================================
   CRÉDITOS
========================================================= */

.creditos{

  background:#050d1d;

  text-align:center;

  padding:
    30px
    15px
    40px;

  color:#ddd;

  font-family:Arial,sans-serif;
}

.creditos .hecho{

  font-size:13px;

  margin-bottom:8px;
}

.creditos .marca{

  color:#d8b75b;

  font-size:22px;

  font-weight:bold;

  letter-spacing:2px;

  margin-bottom:15px;
}

.creditos a{

  display:block;

  color:white;

  text-decoration:none;

  font-size:14px;

  margin:6px 0;
}

.creditos a:hover{
  color:#d8b75b;
}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

  .contador{

    /*
      Más abajo de la frase,
      pero separado de la rosa.
    */

    top:59%;

    width:94%;

    gap:4px;
  }


  .tiempo{

    min-width:48px;
  }


  .numero{

    font-size:
      clamp(23px,7vw,34px);
  }


  .etiqueta{

    font-size:
      clamp(7px,1.8vw,10px);

    letter-spacing:
      1px;

    margin-top:6px;
  }


  /*
     ROSA MÁS PEQUEÑA
  */

  .zona-rosa{

    top:71%;

    height:28%;

    align-items:flex-start;
  }


  .rosa-container{

    width:180px;
    height:235px;

    transform:
      scale(.82);

    transform-origin:
      top center;

    animation:
      balanceoRosaMobile
      5s
      ease-in-out
      infinite;
  }


  @keyframes balanceoRosaMobile{

    0%,100%{
      transform:
        scale(.82)
        rotate(-1deg)
        translateY(0);
    }

    50%{
      transform:
        scale(.82)
        rotate(1deg)
        translateY(-3px);
    }

  }


  .boton-whatsapp{

    font-size:14px;

    padding:
      12px
      21px;
  }

}


/* =========================================================
   PANTALLAS MUY PEQUEÑAS
========================================================= */

@media(max-width:380px){

  .contador{

    top:58%;
  }

  .numero{

    font-size:22px;
  }

  .etiqueta{

    font-size:7px;
  }

  .zona-rosa{

    top:70%;
  }

}

</style>
</head>

<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const portada =
  document.getElementById("portada");

const contenido =
  document.getElementById("contenido");

const musica =
  document.getElementById("musica");

const botonMusica =
  document.getElementById("botonMusica");


/* =========================================================
   ABRIR INVITACIÓN
========================================================= */

function abrirInvitacion(){

  contenido.classList.add("visible");

  /*
     La música empieza desde 0:00
  */

  musica.currentTime = 0;

  musica.volume = 1;

  musica.play().catch(
    function(error){

      console.log(
        "El navegador bloqueó el audio:",
        error
      );

    }
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   PORTADA
========================================================= */

portada.addEventListener(
  "click",
  abrirInvitacion
);


/* =========================================================
   BOTÓN MÚSICA
========================================================= */

function toggleMusica(){

  if(musica.paused){

    musica.play();

    botonMusica.innerHTML="♪";

  }else{

    musica.pause();

    botonMusica.innerHTML="🔇";

  }

}


botonMusica.addEventListener(
  "click",
  function(event){

    event.stopPropagation();

    toggleMusica();

  }
);


/* =========================================================
   CRONÓMETRO
========================================================= */

const fechaXV =
  new Date(
    2026,
    11,
    30,
    0,
    0,
    0
  ).getTime();


function actualizarCronometro(){

  const ahora =
    new Date().getTime();


  let diferencia =
    fechaXV - ahora;


  if(diferencia < 0){

    diferencia = 0;

  }


  const dias =
    Math.floor(
      diferencia /
      (1000 * 60 * 60 * 24)
    );


  const horas =
    Math.floor(
      (
        diferencia %
        (1000 * 60 * 60 * 24)
      ) /
      (1000 * 60 * 60)
    );


  const minutos =
    Math.floor(
      (
        diferencia %
        (1000 * 60 * 60)
      ) /
      (1000 * 60)
    );


  const segundos =
    Math.floor(
      (
        diferencia %
        (1000 * 60)
      ) /
      1000
    );


  document.getElementById("dias")
    .textContent =
    dias;


  document.getElementById("horas")
    .textContent =
    String(horas)
    .padStart(2,"0");


  document.getElementById("minutos")
    .textContent =
    String(minutos)
    .padStart(2,"0");


  document.getElementById("segundos")
    .textContent =
    String(segundos)
    .padStart(2,"0");

}


actualizarCronometro();


setInterval(
  actualizarCronometro,
  1000
);

</script>

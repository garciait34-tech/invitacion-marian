<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>XV Años de Marian</title>


<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;
  background:#061329;
  overflow-x:hidden;
  font-family:Georgia,"Times New Roman",serif;
}

.seccion{
  width:100%;
  position:relative;
}

.seccion img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}


/* =========================================================
   PORTADA
========================================================= */

#portada{

  position:fixed;

  inset:0;

  width:100%;
  height:100vh;

  overflow:hidden;

  cursor:pointer;

  z-index:10000;

  opacity:1;

  visibility:visible;

  transition:
    opacity 1.2s ease,
    transform 1.4s ease,
    visibility 1.4s ease;
}

#portada img{

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform 1.5s ease;
}


/* transición al abrir */

#portada.abierta{

  opacity:0;

  visibility:hidden;

  transform:scale(1.08);
}

#portada.abierta img{

  transform:scale(1.08);
}


/* =========================================================
   BOTÓN PORTADA
========================================================= */

.overlay-portada{

  position:absolute;

  inset:0;

  display:flex;

  justify-content:center;

  align-items:flex-end;

  padding-bottom:8%;

  background:
    linear-gradient(
      to bottom,
      transparent 60%,
      rgba(0,0,0,.65)
    );
}

.boton-abrir{

  padding:
    14px 32px;

  border:
    1px solid #d8b75b;

  border-radius:30px;

  color:white;

  background:
    rgba(0,0,0,.3);

  backdrop-filter:blur(5px);

  font-size:17px;

  letter-spacing:2px;

  box-shadow:
    0 0 15px
    rgba(216,183,91,.45);

  animation:
    pulsoBoton
    2.2s
    ease-in-out
    infinite;
}

@keyframes pulsoBoton{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}


/* =========================================================
   CONTENIDO
========================================================= */

#contenido{

  opacity:0;

  visibility:hidden;

  transform:
    translateY(20px);

  transition:
    opacity 1.2s ease,
    transform 1.2s ease,
    visibility 1.2s ease;
}

#contenido.visible{

  opacity:1;

  visibility:visible;

  transform:
    translateY(0);
}


/* =========================================================
   BOTÓN MÚSICA
========================================================= */

.boton-musica{

  position:fixed;

  right:18px;
  bottom:18px;

  width:55px;
  height:55px;

  border-radius:50%;

  border:
    1px solid #d8b75b;

  background:
    rgba(5,14,32,.92);

  color:#d8b75b;

  z-index:9999;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:22px;

  cursor:pointer;

  box-shadow:
    0 0 15px
    rgba(216,183,91,.35);
}


/* =========================================================
   CRONÓMETRO
========================================================= */

#cronometro{

  position:relative;

  width:100%;

  overflow:hidden;

  background:#061a31;
}

.fondo-cronometro{

  display:block;

  width:100%;

  height:auto;
}


/* =========================================================
   CONTADOR
========================================================= */

.contador{

  position:absolute;

  left:50%;

  /*
     La posición está debajo
     de la frase de la imagen.
  */

  top:59%;

  transform:
    translateX(-50%);

  width:90%;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:
    clamp(7px,2.5vw,25px);

  z-index:100;
}

.tiempo{

  text-align:center;

  min-width:55px;
}

.numero{

  display:block;

  color:white;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(25px,6vw,52px);

  font-weight:bold;

  line-height:1;

  text-shadow:

    0 2px 4px
    rgba(0,0,0,.9),

    0 0 8px
    rgba(0,0,0,.8);
}

.etiqueta{

  display:block;

  margin-top:7px;

  color:white;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(7px,1.7vw,14px);

  letter-spacing:
    clamp(1px,1vw,3px);

  text-shadow:
    0 2px 4px
    rgba(0,0,0,.9);
}


/* =========================================================
   ZONA DE LA ROSA
========================================================= */

/*
   La rosa vive solamente aquí.

   Se coloca abajo del cronómetro.
*/

.rosa-zona{

  position:absolute;

  left:0;
  right:0;

  bottom:0;

  height:40%;

  display:flex;

  justify-content:center;

  align-items:flex-end;

  z-index:50;

  pointer-events:none;

  overflow:visible;
}


/* =========================================================
   CONTENEDOR ORIGINAL DE LA ROSA
========================================================= */

.rosa-container{

  position:relative;

  width:250px;

  height:370px;

  transform:
    scale(.70);

  transform-origin:
    bottom center;

  /*
     Movimiento muy suave.
     No afecta la caída de los pétalos.
  */

  animation:
    rosaSuave
    5s
    ease-in-out
    infinite;
}

@keyframes rosaSuave{

  0%,100%{
    margin-left:0;
  }

  50%{
    margin-left:3px;
  }

}


/* =========================================================
   GLASS
   CSS ORIGINAL DE TU ROSA
========================================================= */

.rosa-container .glass{

  height:350px;

  width:200px;

  background:#122139;

  border-radius:
    300px 300px 0px 0px;

  position:absolute;

  left:0;
  top:0;
}

.rosa-container .glass:before{

  content:"";

  height:10px;

  width:10px;

  transform-origin:center;

  border:
    10px solid #122139;

  border-radius:100%;

  position:absolute;

  left:87px;

  top:-25px;
}

.rosa-container .glass:after{

  content:"";

  position:absolute;

  height:15px;

  width:250px;

  background:#a52a2a;

  top:100%;

  left:-13%;
}


/* =========================================================
   BRILLO
========================================================= */

.rosa-container .shine{

  width:12px;

  height:140px;

  background:white;

  opacity:.2;

  position:absolute;

  left:85%;

  top:80px;

  border-radius:100px;

  z-index:10;
}

.rosa-container .shine:before{

  content:"";

  width:12px;

  height:20px;

  position:absolute;

  background:white;

  top:160px;

  border-radius:100px;
}


/* =========================================================
   PÉTALOS
   CSS ORIGINAL
========================================================= */

.rosa-container .petals > div{

  position:absolute;

  background:#d52d58;

  width:45px;

  height:80px;

  top:55px;

  transition:
    all .5s ease-out;
}

.rosa-container .petals > div:nth-child(1){

  border-radius:15px;

  box-shadow:
    0px 0px 30px #f594b8;

  left:80px;

  top:60px;

  background:#d52d58;
}

.rosa-container .petals > div:nth-child(2),
.rosa-container .petals > div:nth-child(4),
.rosa-container .petals > div:nth-child(6){

  background:#b81b43;

  left:60px;

  border-radius:
    0px 30px 0px 30px;

  transform-origin:
    bottom right;
}

.rosa-container .petals > div:nth-child(3),
.rosa-container .petals > div:nth-child(5),
.rosa-container .petals > div:nth-child(7){

  background:#b81b43;

  left:100px;

  border-radius:
    30px 0px 30px 0px;

  transform-origin:
    bottom left;
}


/* =========================================================
   ANIMACIONES DE APERTURA
========================================================= */

.rosa-container .petals > div:nth-child(2){

  z-index:5;

  background:#ab1a3f;

  top:75px;

  height:70px;

  box-shadow:
    0px 0px 50px
    rgba(245,148,184,.5);

  animation:
    bloom2
    3s
    ease-in-out;

  animation-fill-mode:forwards;
}

.rosa-container .petals > div:nth-child(3){

  z-index:4;

  background:#ab1a3f;

  top:75px;

  height:70px;

  box-shadow:
    0px 0px 50px
    rgba(245,148,184,.5);

  animation:
    bloom3
    3s
    ease-in-out,
    glowing
    2.5s
    ease-in-out
    infinite;

  animation-fill-mode:forwards;
}

.rosa-container .petals > div:nth-child(4){

  z-index:3;

  background:#b81b43;

  top:70px;

  height:75px;

  box-shadow:
    0px 0px 50px
    rgba(245,148,184,.5);

  animation:
    bloom4
    3s
    ease-in-out,
    glowing
    2.5s
    ease-in-out
    infinite;

  animation-fill-mode:forwards;
}

.rosa-container .petals > div:nth-child(5){

  z-index:2;

  background:#b81b43;

  top:70px;

  height:75px;

  box-shadow:
    0px 0px 50px
    rgba(245,148,184,.5);

  animation:
    bloom5
    3s
    ease-in-out,
    glowing
    2.5s
    ease-in-out
    infinite;

  animation-fill-mode:forwards;
}

.rosa-container .petals > div:nth-child(6){

  z-index:1;

  background:#c9204b;

  top:65px;

  height:70px;

  box-shadow:
    0px 0px 50px
    rgba(245,148,184,.3);

  animation:
    bloom6
    3s
    ease-in-out,
    glowing
    2.5s
    ease-in-out
    infinite;

  animation-fill-mode:forwards;
}

.rosa-container .petals > div:nth-child(7){

  z-index:0;

  background:#c9204b;

  top:65px;

  height:70px;

  box-shadow:
    0px 0px 50px
    rgba(245,148,184,.3);

  animation:
    bloom7
    3s
    ease-in-out,
    glowing
    2.5s
    ease-in-out
    infinite;

  animation-fill-mode:forwards;
}


/* =========================================================
   PÉTALOS QUE CAEN
========================================================= */

.rosa-container .deadPetals > div{

  position:absolute;

  background:#d52d58;

  width:20px;

  height:15px;

  top:120px;

  border-radius:
    0px 30px 0px 30px;

  box-shadow:
    0px 0px 30px
    rgba(245,148,184,.5);

  transition:
    all .5s ease-out;
}

.rosa-container .deadPetals > div:nth-child(1){

  left:67px;

  transform:
    rotate(-30deg);

  animation:
    falling
    20s
    4s
    ease-in-out
    infinite;
}

.rosa-container .deadPetals > div:nth-child(2){

  left:104px;

  transform:
    rotate(-30deg);

  animation:
    falling
    20s
    8s
    ease-in-out
    infinite;
}

.rosa-container .deadPetals > div:nth-child(3){

  left:91px;

  transform:
    rotate(-30deg);

  animation:
    falling
    20s
    12s
    ease-in-out
    infinite;
}

.rosa-container .deadPetals > div:nth-child(4){

  left:69px;

  transform:
    rotate(-30deg);

  animation:
    falling
    20s
    16s
    ease-in-out
    infinite;
}


/* =========================================================
   HOJAS
========================================================= */

.rosa-container .leaves > div:nth-last-child(1){

  position:absolute;

  width:55px;

  height:30px;

  background:#338f37;

  top:120px;

  left:75px;

  border-radius:100px;
}

.rosa-container .leaves > div:nth-child(1){

  position:absolute;

  width:6px;

  height:210px;

  background:#054c05;

  top:95px;

  left:100px;

  border-radius:
    0 0 100px 100px;
}

.rosa-container .leaves > div:nth-child(2){

  position:absolute;

  width:30px;

  height:50px;

  border-radius:
    5px 40px 20px 40px;

  background:#054c05;

  transform-origin:bottom;

  transform:rotate(-30deg);

  top:180px;

  left:80px;

  box-shadow:
    inset 5px 5px #066406;
}

.rosa-container .leaves > div:nth-child(3){

  position:absolute;

  width:30px;

  height:50px;

  border-radius:
    40px 5px 40px 20px;

  background:#054c05;

  transform-origin:bottom;

  transform:rotate(30deg);

  top:150px;

  left:95px;

  box-shadow:
    inset -5px 5px #066406;
}


/* =========================================================
   ESPINAS
========================================================= */

.rosa-container .thorns > div{

  position:absolute;

  width:0;

  height:0;

  top:140px;
}

.rosa-container .thorns > div:nth-child(odd){

  border-top:
    5px solid transparent;

  border-bottom:
    5px solid transparent;

  border-left:
    5px solid #054c05;

  left:105px;
}

.rosa-container .thorns > div:nth-child(even){

  border-top:
    5px solid transparent;

  border-bottom:
    5px solid transparent;

  border-right:
    5px solid #054c05;

  left:95px;
}

.rosa-container .thorns > div:nth-child(1){

  top:200px;
}

.rosa-container .thorns > div:nth-child(2){

  top:170px;
}

.rosa-container .thorns > div:nth-child(4){

  top:230px;
}


/* =========================================================
   BLOOM
========================================================= */

@keyframes bloom2{

  50%{

    transform:
      rotate(-90deg);

    top:200px;

    left:100px;
  }

  100%{

    transform:
      rotate(-60deg);

    top:252px;

    left:50px;

    background:#71122a;

    box-shadow:
      0px 0px 0px
      rgba(245,148,184,0);
  }
}

@keyframes bloom3{

  100%{
    transform:
      rotate(45deg);
  }
}

@keyframes bloom4{

  100%{
    transform:
      rotate(-20deg);
  }
}

@keyframes bloom5{

  100%{
    transform:
      rotate(20deg);
  }
}

@keyframes bloom6{

  100%{
    transform:
      rotate(-5deg);
  }
}

@keyframes bloom7{

  100%{
    transform:
      rotate(5deg);
  }
}


/* =========================================================
   BRILLO DE LA ROSA
========================================================= */

@keyframes glowing{

  50%{

    background:#d7365f;

    box-shadow:
      0px 0px 60px #f594b8;
  }
}


/* =========================================================
   PÉTALOS CAYENDO
========================================================= */

@keyframes falling{

  20%{

    top:335px;

    background:#9d193b;

    box-shadow:
      0px 0px 0px
      rgba(245,148,184,0);
  }

  100%{

    top:335px;

    opacity:0;
  }
}


/* =========================================================
   CONFIRMAR ASISTENCIA
========================================================= */

#confirmar{
  position:relative;
}

.boton-whatsapp{

  position:absolute;

  left:50%;

  bottom:8%;

  transform:
    translateX(-50%);

  padding:
    14px 28px;

  border-radius:30px;

  background:#0b8f48;

  color:white;

  text-decoration:none;

  font-family:Arial,sans-serif;

  font-size:15px;

  font-weight:bold;

  white-space:nowrap;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.4);
}


/* =========================================================
   CRÉDITOS
========================================================= */

.creditos{

  background:#050d1d;

  text-align:center;

  padding:
    30px 15px 40px;

  color:#ddd;

  font-family:Arial,sans-serif;
}

.creditos .hecho{

  font-size:13px;

  margin-bottom:8px;
}

.creditos .marca{

  color:#d8b75b;

  font-size:22px;

  font-weight:bold;

  letter-spacing:2px;

  margin-bottom:15px;
}

.creditos a{

  display:block;

  color:white;

  text-decoration:none;

  font-size:14px;

  margin:6px 0;
}

.creditos a:hover{

  color:#d8b75b;
}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

  .contador{

    top:59%;

    width:94%;

    gap:4px;
  }

  .tiempo{

    min-width:48px;
  }

  .numero{

    font-size:
      clamp(23px,7vw,34px);
  }

  .etiqueta{

    font-size:
      clamp(7px,1.8vw,10px);

    letter-spacing:1px;

    margin-top:6px;
  }


  /*
     ROSA EN CELULAR

     Se hace más pequeña pero
     conserva exactamente
     su diseño y animaciones.
  */

  .rosa-zona{

    height:39%;

    bottom:0;

    align-items:flex-end;
  }

  .rosa-container{

    transform:
      scale(.54);

    transform-origin:
      bottom center;
  }


  .boton-whatsapp{

    font-size:14px;

    padding:
      12px 21px;
  }

}


/* =========================================================
   CELULARES MUY PEQUEÑOS
========================================================= */

@media(max-width:380px){

  .contador{

    top:58%;
  }

  .numero{

    font-size:22px;
  }

  .etiqueta{

    font-size:7px;
  }

  .rosa-container{

    transform:
      scale(.48);
  }

}

</style>

</head>

</button>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const portada =
  document.getElementById("portada");

const contenido =
  document.getElementById("contenido");

const musica =
  document.getElementById("musica");

const botonMusica =
  document.getElementById("botonMusica");


/* =========================================================
   ABRIR INVITACIÓN
========================================================= */

let invitacionAbierta = false;


function abrirInvitacion(){

  if(invitacionAbierta){
    return;
  }

  invitacionAbierta = true;


  /*
     Primero aparece el contenido
     para permitir la transición.
  */

  contenido.classList.add("visible");


  /*
     Después desaparece la portada.
  */

  portada.classList.add("abierta");


  /*
     Música desde 0:00
  */

  musica.currentTime = 0;

  musica.volume = 1;

  musica.play().catch(
    function(error){

      console.log(
        "El navegador bloqueó el audio:",
        error
      );

    }
  );


  /*
     Nos aseguramos de comenzar
     la invitación desde arriba.
  */

  setTimeout(function(){

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  },300);

}


/* =========================================================
   TOCAR PORTADA
========================================================= */

portada.addEventListener(
  "click",
  abrirInvitacion
);


/* =========================================================
   MÚSICA
========================================================= */

function toggleMusica(){

  if(musica.paused){

    musica.play();

    botonMusica.innerHTML="♪";

  }else{

    musica.pause();

    botonMusica.innerHTML="🔇";

  }

}


botonMusica.addEventListener(
  "click",
  function(event){

    event.stopPropagation();

    toggleMusica();

  }
);


/* =========================================================
   CRONÓMETRO
========================================================= */

const fechaXV =
  new Date(
    2026,
    11,
    30,
    0,
    0,
    0
  ).getTime();


function actualizarCronometro(){

  const ahora =
    new Date().getTime();


  let diferencia =
    fechaXV - ahora;


  if(diferencia < 0){

    diferencia = 0;

  }


  const dias =
    Math.floor(
      diferencia /
      (1000 * 60 * 60 * 24)
    );


  const horas =
    Math.floor(
      (
        diferencia %
        (1000 * 60 * 60 * 24)
      ) /
      (1000 * 60 * 60)
    );


  const minutos =
    Math.floor(
      (
        diferencia %
        (1000 * 60 * 60)
      ) /
      (1000 * 60)
    );


  const segundos =
    Math.floor(
      (
        diferencia %
        (1000 * 60)
      ) /
      1000
    );


  document.getElementById("dias")
    .textContent =
    dias;


  document.getElementById("horas")
    .textContent =
    String(horas)
    .padStart(2,"0");


  document.getElementById("minutos")
    .textContent =
    String(minutos)
    .padStart(2,"0");


  document.getElementById("segundos")
    .textContent =
    String(segundos)
    .padStart(2,"0");

}


actualizarCronometro();


setInterval(
  actualizarCronometro,
  1000
);

</script>


</body>
</html>
